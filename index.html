<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Job — Plateforme professionnelle</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --orange:#F77F00;--orange-h:#E06E00;--orange-s:#FFF3E0;--orange-glow:rgba(247,127,0,.25);
  --green:#009E60;--green-h:#008752;--green-s:#E6F6EE;--green-glow:rgba(0,158,96,.25);
  --ink:#0F172A;--ink-2:#334155;--ink-3:#64748B;--ink-4:#94A3B8;
  --line:#E2E8F0;--line-2:#F1F5F9;--bg:#F8FAFC;--surface:#FFFFFF;
  --red:#DC2626;--red-s:#FEF2F2;--amber:#D97706;--amber-s:#FFFBEB;
  --blue:#0EA5E9;--blue-s:#F0F9FF;
  --r-sm:6px;--r:10px;--r-lg:14px;--r-xl:20px;
  --sh-sm:0 1px 2px rgba(15,23,42,.06);
  --sh:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --sh-md:0 4px 6px -1px rgba(15,23,42,.08),0 2px 4px -1px rgba(15,23,42,.04);
  --sh-lg:0 10px 15px -3px rgba(15,23,42,.08),0 4px 6px -2px rgba(15,23,42,.04);
  --sh-xl:0 20px 25px -5px rgba(15,23,42,.1),0 10px 10px -5px rgba(15,23,42,.04);
  --transition:.25s cubic-bezier(.4,0,.2,1);
  --bounce:cubic-bezier(.68,-.55,.265,1.55);
}
[data-theme="dark"]{
  --ink:#F1F5F9;--ink-2:#CBD5E1;--ink-3:#94A3B8;--ink-4:#64748B;
  --line:#1E293B;--line-2:#1E293B;--bg:#0F172A;--surface:#1E293B;
  --orange-s:#422006;--green-s:#052E1B;--red-s:#450A0A;--amber-s:#452A02;--blue-s:#082F49;
}

/* ============ ANIMATIONS ============ */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeInDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes slideInRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideInLeft{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.85}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.6}100%{transform:scale(2.2);opacity:0}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
@keyframes floatSlow{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-20px) rotate(3deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes ripple{to{transform:scale(4);opacity:0}}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes typing{from{width:0}to{width:100%}}
@keyframes checkmark{0%{stroke-dashoffset:50}100%{stroke-dashoffset:0}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(247,127,0,.3)}50%{box-shadow:0 0 40px rgba(247,127,0,.6)}}
@keyframes barFill{from{width:0}}
@keyframes dots{0%,20%{color:transparent;text-shadow:.25em 0 0 transparent,.5em 0 0 transparent}
  40%{color:var(--ink);text-shadow:.25em 0 0 transparent,.5em 0 0 transparent}
  60%{text-shadow:.25em 0 0 var(--ink),.5em 0 0 transparent}
  80%,100%{text-shadow:.25em 0 0 var(--ink),.5em 0 0 var(--ink)}}

/* ============ BASE ============ */
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px;min-height:100vh;
  transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
a{color:var(--green);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit}
.hidden{display:none!important}
.muted{color:var(--ink-3);font-size:13px}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Reveal on scroll */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .6s ease,transform .6s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
.reveal-stagger>*{opacity:0;transform:translateY(20px);animation:fadeInUp .5s ease forwards}
.reveal-stagger>*:nth-child(1){animation-delay:.05s}
.reveal-stagger>*:nth-child(2){animation-delay:.1s}
.reveal-stagger>*:nth-child(3){animation-delay:.15s}
.reveal-stagger>*:nth-child(4){animation-delay:.2s}
.reveal-stagger>*:nth-child(5){animation-delay:.25s}
.reveal-stagger>*:nth-child(6){animation-delay:.3s}

/* Page transition */
.page-enter{animation:fadeInUp .4s ease}

/* ============ TOPBAR ============ */
.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;transition:background .3s}
.topbar-inner{max-width:1280px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:8px;cursor:pointer;position:relative}
.logo-bar{width:4px;height:22px;border-radius:2px;background:linear-gradient(180deg,var(--orange),var(--orange-h));
  background-size:200% 100%;animation:gradientShift 3s ease infinite}
.logo-bar.g{background:linear-gradient(180deg,var(--green),var(--green-h));
  background-size:200% 100%;animation:gradientShift 3s ease infinite reverse}
.logo b{color:var(--ink)}
.logo em{font-style:normal;background:linear-gradient(90deg,var(--orange),var(--orange-h),var(--orange));
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:gradientShift 3s ease infinite}
.logo:hover{transform:scale(1.02);transition:transform .3s}
.topbar-search{flex:1;max-width:460px;position:relative}
.topbar-search input{padding-left:38px;background:var(--line-2);border-color:transparent;transition:all .25s}
.topbar-search input:focus{background:var(--surface);border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-glow)}
.topbar-search .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);transition:color .2s}
.topbar-search input:focus~.icon{color:var(--orange)}
.topbar-actions{display:flex;align-items:center;gap:4px;margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--ink-2);position:relative;transition:all .25s}
.icon-btn:hover{background:var(--line-2);transform:translateY(-2px)}
.icon-btn:active{transform:translateY(0) scale(.95)}
.icon-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;
  background:var(--orange);border:2px solid var(--surface);animation:pulse 2s infinite}
.icon-btn .dot::before{content:'';position:absolute;inset:-4px;border-radius:50%;
  background:var(--orange);animation:pulseRing 2s infinite;z-index:-1}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--orange),var(--green));
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px;flex-shrink:0;
  box-shadow:0 2px 8px rgba(15,23,42,.15)}
.avatar-lg{width:96px;height:96px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--orange),var(--green));
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:32px;flex-shrink:0;
  box-shadow:0 4px 16px rgba(15,23,42,.2);position:relative}
.avatar-lg::after{content:'';position:absolute;inset:-4px;border-radius:50%;
  background:linear-gradient(135deg,var(--orange),var(--green));opacity:.2;z-index:-1}
.avatar-md{width:48px;height:48px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--orange),var(--green));
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px;flex-shrink:0}

.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:64px;z-index:30;
  overflow-x:auto;scrollbar-width:thin}
.tabs-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;gap:2px}
.tab{padding:14px 16px;font-size:14px;font-weight:600;color:var(--ink-3);border-bottom:3px solid transparent;
  white-space:nowrap;display:flex;align-items:center;gap:6px;position:relative;transition:all .2s}
.tab::before{content:'';position:absolute;bottom:-1px;left:50%;width:0;height:3px;background:var(--orange);
  transition:all .3s;transform:translateX(-50%)}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--orange)}
.tab.active::before{width:100%}
.tab .count{background:var(--green);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;font-weight:700;
  animation:scaleIn .3s var(--bounce)}

.wrap{max-width:1280px;margin:0 auto;padding:24px 20px 64px}
.page-title{font-size:24px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
.page-sub{color:var(--ink-3);font-size:14px;margin-bottom:24px}

/* ============ CARDS ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-bottom:18px;
  box-shadow:var(--sh-sm);transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden}
.card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.card h3{font-size:16px;margin-bottom:14px;font-weight:700}
.card-narrow{max-width:800px}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.sep{height:1px;background:var(--line);margin:18px 0}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:8px;
  border:1px solid transparent;font-size:14px;font-weight:600;white-space:nowrap;position:relative;overflow:hidden;
  transition:all .25s cubic-bezier(.4,0,.2,1)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange-h));color:#fff;
  box-shadow:0 2px 8px var(--orange-glow)}
.btn-primary:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px var(--orange-glow)}
.btn-primary:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn-green{background:linear-gradient(135deg,var(--green),var(--green-h));color:#fff;
  box-shadow:0 2px 8px var(--green-glow)}
.btn-green:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px var(--green-glow)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover:not(:disabled){border-color:var(--ink-4);background:var(--line-2);transform:translateY(-1px)}
.btn-danger{background:var(--surface);border-color:#FCA5A5;color:var(--red)}
.btn-danger:hover:not(:disabled){background:var(--red-s);transform:translateY(-1px)}
.btn-blue{background:linear-gradient(135deg,var(--blue),#0284C7);color:#fff;box-shadow:0 2px 8px rgba(14,165,233,.25)}
.btn-blue:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 20px rgba(14,165,233,.35)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:6px}
.btn-lg{padding:12px 24px;font-size:15px}
.btn-block{width:100%}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.6);transform:scale(0);
  animation:ripple .6s linear;pointer-events:none}

/* ============ FORMS ============ */
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],
input[type=search],input[type=file],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;
  background:var(--surface);color:var(--ink);transition:all .25s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);
  box-shadow:0 0 0 4px var(--orange-glow);transform:translateY(-1px)}
textarea{resize:vertical;min-height:100px}
.field{margin-bottom:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.field-row{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--ink-3);margin-top:5px}
.pwd-meter{display:flex;gap:3px;margin-top:6px;height:4px}
.pwd-meter i{flex:1;background:var(--line);border-radius:2px;transition:all .3s}
.pwd-meter[data-score="1"] i:nth-child(1){background:var(--red)}
.pwd-meter[data-score="2"] i:nth-child(-n+2){background:var(--amber)}
.pwd-meter[data-score="3"] i:nth-child(-n+3){background:#10B981}
.pwd-meter[data-score="4"] i{background:var(--green)}

/* ============ AUTH SCREEN ============ */
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#FFF8F0 0%,#FFFFFF 45%,#F0FAF5 100%)}
[data-theme="dark"] .auth-screen{background:linear-gradient(135deg,#1a0f00 0%,#0F172A 45%,#001a10 100%)}
.auth-bg-blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.3;animation:floatSlow 8s ease-in-out infinite}
.auth-bg-blob.b1{width:400px;height:400px;background:var(--orange);top:-100px;left:-100px}
.auth-bg-blob.b2{width:300px;height:300px;background:var(--green);bottom:-80px;right:-80px;animation-delay:-4s}
.auth-card{width:100%;max-width:500px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-xl);padding:32px;box-shadow:var(--sh-xl);position:relative;z-index:1;animation:fadeInUp .5s ease}
.flagline{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-bottom:22px}
.flagline i{flex:1;animation:slideInRight .6s ease both}
.flagline i:nth-child(1){background:var(--orange);animation-delay:.1s}
.flagline i:nth-child(2){background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);animation-delay:.2s}
.flagline i:nth-child(3){background:var(--green);animation-delay:.3s}
.auth-brand{text-align:center;margin-bottom:24px}
.auth-brand h1{font-size:26px;font-weight:800;letter-spacing:.6px}
.auth-brand h1 em{font-style:normal;background:linear-gradient(90deg,var(--orange),var(--orange-h));
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:gradientShift 3s ease infinite}
.auth-brand p{color:var(--ink-3);font-size:13px;margin-top:4px}
.auth-switch{display:flex;background:var(--line-2);border-radius:8px;padding:4px;margin-bottom:22px;position:relative}
.auth-switch button{flex:1;padding:9px;border-radius:6px;font-size:14px;font-weight:600;color:var(--ink-3);transition:all .25s}
.auth-switch button.active{background:var(--surface);color:var(--orange);box-shadow:var(--sh-sm)}

/* ============ HERO ============ */
.hero{background:linear-gradient(135deg,var(--orange) 0%,var(--orange-h) 50%,var(--green) 100%);
  background-size:200% 200%;animation:gradientShift 15s ease infinite;
  color:#fff;padding:60px 20px;position:relative;overflow:hidden;border-radius:var(--r-xl);margin-bottom:24px}
.hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 2px 2px,rgba(255,255,255,.15) 1px,transparent 0);
  background-size:30px 30px;opacity:.5}
.hero-content{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:40px;flex-wrap:wrap;position:relative;z-index:1}
.hero-text{flex:1;min-width:280px;animation:fadeInUp .6s ease .2s both}
.hero-text h2{font-size:42px;font-weight:800;line-height:1.1;margin-bottom:14px;letter-spacing:-1px}
.hero-text p{font-size:17px;opacity:.95;margin-bottom:24px;line-height:1.6}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap}
.hero-cta .btn{background:#fff;color:var(--orange);padding:14px 28px;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.hero-cta .btn:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.hero-cta .btn.outline{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.5)}
.hero-cta .btn.outline:hover{background:rgba(255,255,255,.15);border-color:#fff}
.hero-illustration{flex:1;min-width:280px;max-width:400px;animation:float 6s ease-in-out infinite}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;
  line-height:1.4;white-space:nowrap;gap:4px;transition:all .2s}
.badge-orange{background:var(--orange-s);color:#B45309}
.badge-green{background:var(--green-s);color:var(--green-h)}
.badge-grey{background:var(--line-2);color:var(--ink-2)}
.badge-red{background:var(--red-s);color:var(--red)}
.badge-amber{background:var(--amber-s);color:var(--amber)}
.badge-blue{background:var(--blue-s);color:#0369A1}

.trust-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;font-size:11px;
  font-weight:700;text-transform:uppercase;transition:transform .2s}
.trust-badge:hover{transform:scale(1.05)}
.trust-verified{background:var(--green-s);color:var(--green-h)}
.trust-top{background:linear-gradient(135deg,#FEF3C7,#FDE68A);color:#78350F}
.trust-new{background:var(--line-2);color:var(--ink-2)}

/* ============ ITEMS ============ */
.item{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;
  background:var(--surface);transition:all .3s cubic-bezier(.4,0,.2,1)}
.item:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:var(--ink-4)}
.item-clickable{cursor:pointer}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.item-title{font-weight:700;font-size:15px;margin-bottom:4px}
.item-meta{font-size:13px;color:var(--ink-3)}
.item-body{margin-top:10px;font-size:14px;line-height:1.6;color:var(--ink-2)}
.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-2)}
.item-highlight{border-left:4px solid var(--green);position:relative}
.item-highlight::before{content:'';position:absolute;left:-4px;top:0;bottom:0;width:4px;
  background:var(--green);box-shadow:0 0 12px var(--green-glow)}

/* ============ TABLES ============ */
table.table{width:100%;border-collapse:collapse;font-size:14px}
table.table th{text-align:left;padding:10px 12px;border-bottom:2px solid var(--line);
  font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);font-weight:700}
table.table td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle;transition:background .2s}
table.table tr:hover td{background:var(--line-2)}
.table-scroll{overflow-x:auto}

/* ============ STATS ============ */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;
  box-shadow:var(--sh-sm);transition:all .3s;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--orange),var(--green));transform:scaleX(0);transform-origin:left;
  transition:transform .3s}
.stat:hover::before{transform:scaleX(1)}
.stat:hover{box-shadow:var(--sh-lg);transform:translateY(-3px)}
.stat .num{font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-.5px;line-height:1.1}
.stat .lbl{font-size:13px;color:var(--ink-3);margin-top:2px}
.stat.stat-orange .num{color:var(--orange)}
.stat.stat-green .num{color:var(--green)}
.stat.stat-amber .num{color:var(--amber)}
.stat.stat-blue .num{color:var(--blue)}

/* ============ MESSAGES ============ */
.thread{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding:16px;
  background:var(--line-2);border-radius:8px;margin-bottom:14px}
.bubble{max-width:78%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5;
  word-wrap:break-word;animation:slideUp .3s ease;box-shadow:0 1px 2px rgba(15,23,42,.06)}
.bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--green),var(--green-h));color:#fff;
  border-bottom-right-radius:3px}
.bubble.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:3px}
.bubble .time{display:block;font-size:11px;opacity:.7;margin-top:4px}

/* ============ MODAL ============ */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.6);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:100;animation:fadeIn .2s;backdrop-filter:blur(4px)}
.modal{background:var(--surface);border-radius:var(--r-lg);max-width:520px;width:100%;max-height:90vh;
  overflow-y:auto;box-shadow:var(--sh-xl);animation:scaleIn .25s cubic-bezier(.4,0,.2,1)}
.modal-lg{max-width:820px}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:center;gap:12px}
.modal-header h3{font-size:17px;font-weight:700;margin:0}
.modal-body{padding:24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}

/* ============ TOAST ============ */
#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:10px;z-index:200;pointer-events:none;max-width:calc(100% - 32px);width:420px}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;
  box-shadow:var(--sh-xl);display:flex;align-items:center;gap:10px;pointer-events:auto;
  animation:slideUp .3s cubic-bezier(.4,0,.2,1);border-left:4px solid transparent}
.toast.success{background:var(--green);border-left-color:#065F46}
.toast.error{background:var(--red);border-left-color:#7F1D1D}
.toast.warn{background:var(--amber);border-left-color:#78350F}
.toast.info{background:var(--blue);border-left-color:#0369A1}
.toast .close{margin-left:auto;opacity:.7;padding:2px;transition:opacity .2s}
.toast .close:hover{opacity:1}

/* ============ EMPTY STATES ============ */
.empty{text-align:center;padding:48px 20px;color:var(--ink-3);animation:fadeInUp .5s ease}
.empty-illustration{margin:0 auto 20px;max-width:180px;opacity:.85;animation:float 4s ease-in-out infinite}
.empty h4{font-size:16px;color:var(--ink-2);margin-bottom:8px;font-weight:700}
.empty p{font-size:14px;margin-bottom:20px;max-width:360px;margin-left:auto;margin-right:auto;line-height:1.6}

/* ============ DROPDOWNS ============ */
.dropdown{position:absolute;top:calc(100% + 8px);right:0;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--sh-xl);min-width:340px;max-width:calc(100vw - 40px);z-index:50;
  overflow:hidden;animation:fadeInDown .2s ease}
.dropdown-header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;
  align-items:center;font-weight:700;font-size:14px}
.dropdown-list{max-height:360px;overflow-y:auto}
.dropdown-item{padding:12px 16px;border-bottom:1px solid var(--line-2);font-size:13px;cursor:pointer;transition:all .2s}
.dropdown-item:hover{background:var(--line-2);padding-left:20px}
.dropdown-item.unread{background:var(--orange-s);border-left:3px solid var(--orange)}
.dropdown-item .meta{color:var(--ink-3);font-size:11px;margin-top:4px}
.dropdown-footer{padding:10px 16px;text-align:center;border-top:1px solid var(--line);font-size:13px}
.user-menu{min-width:240px}
.user-menu-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.user-menu-head .info{line-height:1.3;min-width:0}
.user-menu-head .info b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-menu-head .info span{font-size:12px;color:var(--ink-3)}
.user-menu-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:14px;
  color:var(--ink-2);width:100%;text-align:left;transition:all .2s}
.user-menu-item:hover{background:var(--line-2);padding-left:20px;text-decoration:none}
.user-menu-item.danger{color:var(--red)}

/* ============ STARS ============ */
.stars{display:inline-flex;gap:1px;vertical-align:middle}
.stars svg{color:var(--amber);transition:transform .2s}
.stars svg:hover{transform:scale(1.2)}
.stars .off{color:var(--line)}
.star-input{display:inline-flex;gap:4px;cursor:pointer}
.star-input button{padding:2px;color:var(--line);transition:all .2s}
.star-input button.on{color:var(--amber)}
.star-input button:hover{transform:scale(1.2)}

/* ============ CHARTS ============ */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;
  transition:all .3s}
.chart-card:hover{box-shadow:var(--sh-md)}
.chart-card h3{font-size:15px;margin-bottom:16px}
.chart-canvas{width:100%;height:220px;display:block}

/* ============ PAGINATION ============ */
.pagination{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:20px;flex-wrap:wrap}
.pagination button{min-width:36px;height:36px;border-radius:6px;font-size:14px;color:var(--ink-2);
  border:1px solid var(--line);background:var(--surface);transition:all .2s}
.pagination button:hover:not(:disabled){border-color:var(--orange);color:var(--orange);transform:translateY(-2px)}
.pagination button.active{background:linear-gradient(135deg,var(--orange),var(--orange-h));color:#fff;
  border-color:var(--orange);box-shadow:0 2px 8px var(--orange-glow)}
.pagination button:disabled{opacity:.4;cursor:not-allowed}

/* ============ MISC ============ */
.doc-thumb{max-width:140px;border-radius:6px;border:1px solid var(--line);display:block;margin-top:6px;cursor:pointer;
  transition:all .2s}
.doc-thumb:hover{transform:scale(1.03);box-shadow:var(--sh-md)}
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:16px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.filter-bar .field{margin:0;flex:1;min-width:150px}
.banner{padding:14px 18px;border-radius:8px;font-size:14px;margin-bottom:18px;display:flex;
  align-items:flex-start;gap:10px;animation:fadeInUp .3s ease}
.banner-warn{background:var(--amber-s);border:1px solid #FDBA74;color:#9A3412}
.banner-info{background:var(--green-s);border:1px solid #6EE7B7;color:#065F46}
.banner-blue{background:var(--blue-s);border:1px solid #7DD3FC;color:#0C4A6E}
.profile-head{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.link{color:var(--green);cursor:pointer;font-weight:600}
footer.foot{text-align:center;padding:24px 20px;font-size:12px;color:var(--ink-3);
  border-top:1px solid var(--line);background:var(--surface);margin-top:40px}

/* ============ SKELETON ============ */
.skeleton{background:linear-gradient(90deg,var(--line-2) 0%,var(--line) 50%,var(--line-2) 100%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:6px;height:16px}

/* ============ RESPONSIVE ============ */
@media(max-width:640px){
  .topbar-search{display:none}
  .wrap{padding:16px 14px 48px}
  .page-title{font-size:20px}
  .auth-card{padding:24px 20px}
  .tabs{top:60px}
  .tabs-inner{padding:0 14px}
  .tab{padding:12px 12px;font-size:13px}
  .bubble{max-width:88%}
  .modal-body{padding:18px}
  .modal-header,.modal-footer{padding:14px 18px}
  .dropdown{right:-8px;min-width:280px}
  .hero-text h2{font-size:28px}
  .hero{padding:40px 20px}
}
</style>
</head>

<script>
/* =========================================================================
   MON JOB v5 — Design pro + animations, sans paiement
   ========================================================================= */

const CONFIG = {
  categories:['Plomberie','Électricité','Menuiserie','Maçonnerie','Peinture',
    'Mécanique','Couture','Coiffure','Cuisine','Jardinage','Informatique',
    'Transport','Ménage','Sécurité','Design','Marketing','Comptabilité',
    'Traduction','Autre'],
  villes:['Abidjan','Bouaké','Daloa','Yamoussoukro','San-Pédro','Korhogo',
    'Man','Gagnoa','Divo','Autre'],
  perPage:8,
  sessionTimeoutMs:30*60*1000,
  maxLoginAttempts:5,
  lockDurationMs:5*60*1000,
  maxFileSize:800*1024,
  dbKey:'monjob_db_v5'
};

const $ = (s,el=document) => el.querySelector(s);
const $$ = (s,el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now = () => new Date().toISOString();
const fmtDate = iso => { if(!iso) return ''; const d = new Date(iso); return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); };
const fmtDateShort = iso => { if(!iso) return ''; return new Date(iso).toLocaleDateString('fr-FR'); };
const fmtNum = n => n==null || n==='' ? '' : Number(n).toLocaleString('fr-FR');
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate()-n); return d; };
const sameDay = (a,b) => a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const debounce = (fn,ms=300) => { let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms);}; };

function hashPassword(pwd, salt){
  salt = salt || uid('s');
  const input = salt + ':' + pwd;
  let h = 0;
  for(let i=0;i<input.length;i++){ h = ((h<<5)-h) + input.charCodeAt(i); h = h & h; }
  return salt+'$'+(h>>>0).toString(16);
}
function verifyPassword(pwd, stored){
  if(!stored || !stored.includes('$')) return false;
  return hashPassword(pwd, stored.split('$')[0]) === stored;
}
function passwordScore(p){
  let s=0;
  if(p.length>=8) s++;
  if(p.length>=12) s++;
  if(/[A-Z]/.test(p) && /[a-z]/.test(p)) s++;
  if(/[0-9]/.test(p) && /[^A-Za-z0-9]/.test(p)) s++;
  return Math.min(s,4);
}
function passwordErrors(p){
  const e=[];
  if(p.length<8) e.push('8 caractères minimum');
  if(!/[A-Z]/.test(p)) e.push('une majuscule');
  if(!/[a-z]/.test(p)) e.push('une minuscule');
  if(!/[0-9]/.test(p)) e.push('un chiffre');
  if(!/[^A-Za-z0-9]/.test(p)) e.push('un caractère spécial');
  return e;
}
const emailValide = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

let DB = {};
function defaultDB(){
  return {
    users:[{ id:'u_admin', role:'admin', prenom:'Mon Job', nom:'Administrateur',
      email:'admin@monjob.ci', phone:'+225 00 00 00 00', ville:'Abidjan',
      metier:'', bio:'', password:hashPassword('Admin@2026'),
      statut:'actif', photo:'', cni:'',
      kyc:{ email:true, phone:true, cni:true }, twoFA:false,
      prefNotif:{ email:true, push:true, sms:false, marketing:false },
      onboardingDone:true, theme:'light', lang:'fr',
      createdAt:now(), lastLogin:null, loginAttempts:0, lockUntil:null }],
    annonces:[], devis:[], messages:[], notifications:[], avis:[],
    favoris:[], signalements:[], contrats:[], litiges:[], tickets:[],
    auditLog:[], emails:[],
    session:null, theme:'light', lang:'fr'
  };
}
function loadDB(){
  try{
    const raw = localStorage.getItem(CONFIG.dbKey);
    DB = raw ? JSON.parse(raw) : defaultDB();
    if(!DB.users || !DB.users.length) DB = defaultDB();
  } catch(e){ DB = defaultDB(); }
}
function saveDB(){ try{ localStorage.setItem(CONFIG.dbKey, JSON.stringify(DB)); } catch(e){ toast('Stockage saturé.','error'); } }
function me(){ return DB.users.find(u=>u.id===DB.session) || null; }
function userById(id){ return DB.users.find(u=>u.id===id) || null; }
function fullName(u){ return u ? (u.prenom+' '+u.nom).trim() : 'Utilisateur'; }
function initials(u){ return u ? ((u.prenom||'?')[0]+(u.nom||'')[0]||'').toUpperCase() : '?'; }

function audit(action, details){
  const u = me();
  DB.auditLog.push({ id:uid('l'), userId:u?u.id:null, action, details, date:now() });
  if(DB.auditLog.length > 1000) DB.auditLog = DB.auditLog.slice(-1000);
}
function sendEmail(to, subject, body, type='info'){
  DB.emails.push({ id:uid('e'), to, subject, body, type, date:now() });
  if(DB.emails.length > 300) DB.emails = DB.emails.slice(-300);
}
function notify(userId, texte, link=null){
  DB.notifications.push({ id:uid('n'), userId, texte, link, lu:false, date:now() });
  if(DB.notifications.length > 300) DB.notifications = DB.notifications.slice(-300);
}
function unreadCount(userId){ return DB.notifications.filter(n=>n.userId===userId && !n.lu).length; }

const icon = (name, size=18) => {
  const s = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;

    briefcase:`<rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>`,

    settings:`<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>`,

    globe:`<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>`,
    phone:`<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>`,
    help:`<circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>`,
    scale:`<path d="M16 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"/><path d="M2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>`
  };
  return `<svg ${s}>${p[name]||''}</svg>`;
};

/* ============ ILLUSTRATIONS SVG (empty states) ============ */

function toast(message, type='info'){
  const icons = { info:'info', success:'check', error:'x', warn:'warning' };
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.innerHTML = icon(icons[type]||'info',18) + '<span>'+esc(message)+'</span>' + `<button class="close">${icon('x',16)}</button>`;
  $('#toast-root').appendChild(t);
  const remove = () => { t.style.opacity='0'; t.style.transform='translateY(20px)'; setTimeout(()=>t.remove(),200); };
  t.querySelector('.close').onclick = remove;
  setTimeout(remove, 4000);
}

let modalOnClose = null;
function openModal({title, content, size='', footer=null, onMount=null, onClose=null}){
  closeModal();
  $('#modal-root').innerHTML = `
    <div class="modal-backdrop" data-backdrop>
      <div class="modal ${size}" role="dialog">
        <div class="modal-header"><h3>${esc(title)}</h3><button class="icon-btn" data-close>${icon('x',18)}</button></div>
        <div class="modal-body">${content}</div>
        ${footer ? `<div class="modal-footer">${footer}</div>` : ''}
      </div>
    </div>`;
  const backdrop = $('[data-backdrop]');
  backdrop.addEventListener('click', e => { if(e.target === backdrop) closeModal(); });
  $('[data-close]').onclick = closeModal;
  document.addEventListener('keydown', escCloseModal);
  modalOnClose = onClose;
  if(onMount) onMount($('.modal'));
}
function closeModal(){ document.removeEventListener('keydown', escCloseModal); $('#modal-root').innerHTML = ''; if(modalOnClose){ try{modalOnClose();}catch(e){} modalOnClose = null; } }
function escCloseModal(e){ if(e.key === 'Escape') closeModal(); }
function confirmDialog({title, message, confirmLabel='Confirmer', cancelLabel='Annuler', danger=false}){
  return new Promise(resolve => {
    openModal({ title,
      content:`<p style="font-size:14px;line-height:1.6;color:var(--ink-2)">${esc(message)}</p>`,
      footer:`<button class="btn btn-ghost" data-cancel>${esc(cancelLabel)}</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-confirm>${esc(confirmLabel)}</button>`,
      onMount: m => {
        m.querySelector('[data-cancel]').onclick = () => { resolve(false); closeModal(); };
        m.querySelector('[data-confirm]').onclick = () => { resolve(true); closeModal(); };
      },
      onClose: () => resolve(false) });
  });
}

/* Ripple effect on buttons */
function attachRipple(){
  $$('.btn').forEach(btn => {
    if(btn._ripple) return;
    btn._ripple = true;
    btn.addEventListener('click', e => {
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const x = e.clientX - rect.left - size/2;
      const y = e.clientY - rect.top - size/2;
      const r = document.createElement('span');
      r.className = 'ripple';
      r.style.width = r.style.height = size + 'px';
      r.style.left = x + 'px'; r.style.top = y + 'px';
      btn.appendChild(r);
      setTimeout(() => r.remove(), 600);
    });
  });
}

/* Scroll reveal */
function setupReveal(){
  const els = $$('.card, .item, .stat, .chart-card');
  if(!('IntersectionObserver' in window)) return;
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if(entry.isIntersecting){
        entry.target.style.animation = `fadeInUp .5s ease ${i*0.05}s both`;
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1 });
  els.forEach(el => { if(!el.style.animation) observer.observe(el); });
}

/* Count-up animation */
function animateCounters(){
  $$('[data-count]').forEach(el => {
    const target = Number(el.dataset.count);
    if(isNaN(target)) return;
    const duration = 800;
    const start = performance.now();
    const update = (t) => {
      const elapsed = t - start;
      const progress = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3);
      el.textContent = Math.round(target * ease).toLocaleString('fr-FR');
      if(progress < 1) requestAnimationFrame(update);
    };
    requestAnimationFrame(update);
  });
}

/* Parallax on hero */
function setupParallax(){
  const hero = $('.hero');
  if(!hero) return;
  window.addEventListener('scroll', () => {
    const scrolled = window.pageYOffset;
    if(scrolled < 400){
      hero.style.transform = `translateY(${scrolled * 0.15}px)`;
    }
  }, { passive: true });
}

function logout(silent=false){
  DB.session = null; saveDB();
  toast(silent ? 'Session expirée.' : 'Vous êtes déconnecté.', silent ? 'warn' : 'info');
  location.hash = '#/login'; render();

function handleLogin(email, password, remember){
  email = email.trim().toLowerCase();
  const u = DB.users.find(x => x.email.toLowerCase() === email);
  if(!u){ toast('Identifiants incorrects.','error'); return false; }
  if(u.lockUntil && new Date(u.lockUntil) > new Date()){
    toast('Compte verrouillé. Réessayez plus tard.','error'); return false;
  }
  if(!verifyPassword(password, u.password)){
    u.loginAttempts = (u.loginAttempts||0)+1;
    if(u.loginAttempts >= CONFIG.maxLoginAttempts){
      u.lockUntil = new Date(Date.now()+CONFIG.lockDurationMs).toISOString();
      u.loginAttempts = 0;
      toast('Trop de tentatives. Compte verrouillé 5 minutes.','error');
    } else toast('Identifiants incorrects.','error');
    saveDB(); return false;
  }
  if(u.statut === 'refuse'){ toast('Compte refusé.','error'); return false; }
  if(u.statut === 'suspendu'){ toast('Compte suspendu.','error'); return false; }
  u.loginAttempts = 0; u.lockUntil = null; u.lastLogin = now();
  DB.session = u.id; saveDB(); audit('connexion', u.email);
  lastActivity = Date.now();
  toast('Bienvenue '+u.prenom+'.','success');
  return true;
}

function handleRegister(data){
  if(DB.users.some(u => u.email.toLowerCase() === data.email.toLowerCase())){
    toast('Cet email est déjà utilisé.','error'); return false;
  }
  const perr = passwordErrors(data.password);
  if(perr.length){ toast('Mot de passe trop faible : '+perr.join(', ')+'.','error'); return false; }
  const u = {
    id:uid('u'), role:data.role, prenom:data.prenom, nom:data.nom,
    email:data.email.toLowerCase(), phone:data.phone, ville:data.ville,
    metier:data.role==='prestataire'?data.metier:'',
    bio:'', password:hashPassword(data.password), statut:'en_attente',
    photo:'', cni:'', kyc:{ email:true, phone:false, cni:false }, twoFA:false,
    prefNotif:{ email:true, push:true, sms:false, marketing:false },
    onboardingDone:false, createdAt:now(), lastLogin:null, loginAttempts:0, lockUntil:null
  };
  DB.users.push(u);
  DB.users.filter(x => x.role==='admin').forEach(a =>
    notify(a.id, 'Nouvelle inscription : '+fullName(u)+' ('+data.role+').', '#/admin/inscriptions'));
  sendEmail(u.email, 'Bienvenue sur Mon Job', 'Votre compte a été créé. Il sera activé par un administrateur.', 'inscription');
  audit('inscription', u.email+' ('+u.role+')');
  DB.session = u.id; saveDB();
  toast('Compte créé. En attente de validation.','success');
  return true;
}

function handleForgot(email){
  email = email.trim().toLowerCase();
  const u = DB.users.find(x => x.email.toLowerCase() === email);
  if(!u){ toast('Si cet email existe, un lien a été envoyé.','info'); return true; }
  const token = uid('t');
  u.resetToken = token;
  u.resetExpires = new Date(Date.now()+60*60*1000).toISOString();
  saveDB();
  sendEmail(email, 'Réinitialisation de mot de passe', 'Lien : #/reset/'+token, 'reset');
  toast('Email envoyé (voir Journal admin).','success');
  return true;
}
function handleReset(token, newPassword){
  const u = DB.users.find(x => x.resetToken === token);
  if(!u){ toast('Lien invalide.','error'); return false; }
  if(new Date(u.resetExpires) < new Date()){ toast('Lien expiré.','error'); return false; }
  const errs = passwordErrors(newPassword);
  if(errs.length){ toast('Mot de passe trop faible.','error'); return false; }
  u.password = hashPassword(newPassword);
  u.resetToken = null; u.resetExpires = null;
  saveDB(); toast('Mot de passe réinitialisé.','success');
  return true;
}

function ratingOf(userId){
  const list = DB.avis.filter(a => a.toId === userId);
  if(!list.length) return { avg:0, count:0 };
  return { avg:list.reduce((s,a)=>s+a.note,0)/list.length, count:list.length };
}
function starsHtml(note, size=14){
  let h = '<span class="stars">';
  for(let i=1;i<=5;i++){
    h += `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="${i<=Math.round(note)?'':'off'}" ${i<=Math.round(note)?'style="fill:currentColor"':''}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
  }
  return h+'</span>';
}
function ratingHtml(userId){
  const r = ratingOf(userId);
  if(!r.count) return '<span class="muted">Pas encore noté</span>';
  return starsHtml(r.avg)+` <span class="muted">${r.avg.toFixed(1)} (${r.count})</span>`;
}
function computeBadges(u){
  const badges = [];
  if(u.kyc && u.kyc.cni) badges.push('verified');
  const r = ratingOf(u.id);
  if(u.role === 'prestataire' && r.count >= 3 && r.avg >= 4.5) badges.push('top');
  if((new Date()-new Date(u.createdAt)) < 7*24*3600*1000) badges.push('new');
  return badges;
}
function badgesHtml(u){
  if(!u) return '';
  const b = computeBadges(u);
  const map = { verified:['trust-verified','Vérifié'], top:['trust-top','Top prestataire'], new:['trust-new','Nouveau'] };
  return b.map(x => map[x] ? `<span class="trust-badge ${map[x][0]}">${map[x][1]}</span>` : '').join(' ');
}

    if(route[0]==='register'){ renderAuth('register'); return; }
    if(route[0]==='forgot'){ renderAuth('forgot'); return; }
    if(route[0]==='reset' && route[1]){ renderAuth('reset', route[1]); return; }
    renderAuth('login'); return;
  }
  renderShell(u, route);
  setTimeout(() => { attachRipple(); animateCounters(); }, 50);
}

function renderShell(u, route){
  const tabs = tabsFor(u);
  const pending = u.role !== 'admin' && u.statut !== 'actif';
  const nUnread = unreadCount(u.id);

  $('#root').innerHTML = `
    <header class="topbar">
      <div class="topbar-inner">
        <div class="logo" data-nav="dashboard"><span class="logo-bar"></span><b>MON</b>&nbsp;<em>JOB</em><span class="logo-bar g"></span></div>
        <div class="topbar-search"><span class="icon">${icon('search',18)}</span>
          <input type="search" id="globalSearch" placeholder="Rechercher..." value="${esc(state.annoncesFiltre.q||'')}"></div>
        <div class="topbar-actions">
          <button class="icon-btn" id="btnTheme" title="Thème">${icon(DB.theme==='dark'?'sun':'moon',20)}</button>
          <button class="icon-btn" id="btnLang" title="Langue">${icon('globe',20)}</button>
          <button class="icon-btn" id="btnNotif" title="Notifications">${icon('bell',20)}${nUnread ? '<span class="dot"></span>' : ''}</button>
          <button class="icon-btn" id="btnUserMenu">${u.photo ? `<img src="${u.photo}" class="avatar" alt="">` : `<span class="avatar">${esc(initials(u))}</span>`}</button>
        </div>
      </div>
    </header>
    <nav class="tabs"><div class="tabs-inner">
      ${tabs.map(([id,label]) => {
        const active = route[0]===id || (route[0]==='annonce' && id==='mes-annonces');
        const badge = id==='notifications' && nUnread ? `<span class="count">${nUnread}</span>` : '';
        return `<button class="tab ${active?'active':''}" data-nav="${id}">${label}${badge}</button>`;
      }).join('')}
    </div></nav>
    <main class="wrap" id="main"></main>
    <footer class="foot">Mon Job — Plateforme professionnelle de mise en relation</footer>`;

  $$('[data-nav]').forEach(el => { if(!el.onclick) el.onclick = () => navigate(el.dataset.nav); });
  $('#btnNotif').onclick = showNotificationsPanel;
  $('#btnUserMenu').onclick = showUserMenu;
  $('#btnTheme').onclick = () => { DB.theme = DB.theme==='dark'?'light':'dark'; saveDB(); render(); };
  $('#btnLang').onclick = () => { DB.lang = DB.lang==='fr'?'en':'fr'; saveDB(); toast(DB.lang==='fr'?'Français':'English','success'); render(); };
  const search = $('#globalSearch');
  if(search){
    search.oninput = debounce(() => {
      state.annoncesFiltre.q = search.value;
      state.annoncesFiltre.page = 1;
      const r = getRoute()[0];
      if(['annonces-disponibles','mes-annonces'].includes(r)) renderPage(u, getRoute());
      else navigate('annonces-disponibles');
    }, 350);
  }
  if(pending){
    $('#main').innerHTML = `<div class="banner banner-warn">${icon('warning',20)}<div>Votre compte est en attente de validation par un administrateur.</div></div>${renderProfilPage(u)}`;
    bindProfil(u);
    setTimeout(attachRipple, 30);
    return;
  }
  renderPage(u, route);
}

function tabsFor(u){
  if(u.role === 'admin'){
    return [['admin/dashboard','Tableau de bord'],['admin/inscriptions','Inscriptions'],['admin/users','Utilisateurs'],['admin/annonces','Annonces'],['admin/litiges','Litiges'],['admin/tickets','Tickets'],['admin/audit','Journal'],['admin/emails','Emails'],['profil','Profil']];
  }
  if(u.role === 'prestataire'){
    return [['dashboard','Tableau de bord'],['annonces-disponibles','Annonces'],['mes-devis','Devis'],['messages','Messages'],['mes-avis','Avis'],['notifications','Notifs'],['profil','Profil']];
  }
  return [['dashboard','Tableau de bord'],['mes-annonces','Mes annonces'],['publier','Publier'],['messages','Messages'],['contrats','Contrats'],['notifications','Notifs'],['profil','Profil']];
}

function renderPage(u, route){
  const main = $('#main');
  const key = route[0]+(route[1]?'/'+route[1]:'');
  const pages = {
    'dashboard':()=>renderDashboard(u),
    'publier':()=>renderPublier(u),
    'mes-annonces':()=>renderMesAnnonces(u),
    'annonces-disponibles':()=>renderAnnoncesDispo(u),
    'annonce':()=>renderAnnonceDetail(u, route[1]),
    'messages':()=>renderMessages(u, route[1], route[2]),
    'notifications':()=>renderNotifications(u),
    'profil':()=>renderProfilPage(u),
    'favoris':()=>renderFavoris(u),
    'mes-devis':()=>renderMesDevis(u),
    'mes-avis':()=>renderMesAvis(u),
    'contrats':()=>renderContrats(u),
    'litiges':()=>renderLitiges(u),
    'help':()=>renderHelp(u),
    'settings':()=>renderSettings(u),
    'trust':()=>renderTrust(u),
    'admin/dashboard':()=>renderAdminDashboard(u),
    'admin/inscriptions':()=>renderAdminInscriptions(u),
    'admin/users':()=>renderAdminUsers(u),
    'admin/annonces':()=>renderAdminAnnonces(u),
    'admin/audit':()=>renderAdminAudit(u),
    'admin/emails':()=>renderAdminEmails(u),
    'admin/litiges':()=>renderAdminLitiges(u),
    'admin/tickets':()=>renderAdminTickets(u)
  };
  main.innerHTML = `<div class="page-enter">${(pages[key]||(()=>renderDashboard(u)))()}</div>`;
  bindPage(u, route);
  window.scrollTo({ top: 0, behavior: 'smooth' });
  setTimeout(() => { attachRipple(); animateCounters(); setupReveal(); }, 50);
}

  if(mode==='login'){

          <a href="#/forgot" style="font-size:13px">Mot de passe oublié ?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Se connecter</button>
      </form>
      <div class="sep"></div>
      <p class="muted" style="text-align:center;font-size:12px">Démonstration : admin@monjob.ci / Admin@2026</p>`;

      <form id="formRegister" novalidate>
        <div class="field"><label>Je m'inscris en tant que</label>

        <div class="field-row">
          <div class="field"><label>Ville</label><select id="rg_ville">${CONFIG.villes.map(v=>`<option>${v}</option>`).join('')}</select></div>
          <div class="field" id="metierWrap" style="display:none"><label>Métier</label>
            <select id="rg_metier">${CONFIG.categories.map(c=>`<option>${c}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label>Mot de passe</label><input type="password" id="rg_pass" required>
          <div class="pwd-meter" id="pwdMeter"><i></i><i></i><i></i><i></i></div>
          <p class="hint">8 caractères, majuscule, minuscule, chiffre, caractère spécial.</p></div>
        <div class="field"><label>Confirmer</label><input type="password" id="rg_pass2" required></div>
        <button type="submit" class="btn btn-green btn-block btn-lg">Créer mon compte</button>
      </form>`;
  }
  else if(mode==='forgot'){
    body = `<form id="formForgot" novalidate>
      <p class="muted" style="margin-bottom:16px">Un lien de réinitialisation vous sera transmis.</p>
      <div class="field"><label>Email</label><input type="email" id="fg_email" required></div>
      <button type="submit" class="btn btn-primary btn-block">Envoyer</button>
      <p style="text-align:center;margin-top:14px;font-size:13px"><a href="#/login">Retour</a></p>
    </form>`;
  }
  else if(mode==='reset'){
    body = `<form id="formReset" novalidate>
      <div class="field"><label>Nouveau mot de passe</label><input type="password" id="rs_pass" required>
        <div class="pwd-meter" id="pwdMeterReset"><i></i><i></i><i></i><i></i></div></div>
      <div class="field"><label>Confirmer</label><input type="password" id="rs_pass2" required></div>
      <button type="submit" class="btn btn-primary btn-block">Réinitialiser</button>
    </form>`;
  }
  const sw = (mode==='login'||mode==='register') ? `
    <div class="auth-switch">
      <button data-mode="login" class="${mode==='login'?'active':''}">Connexion</button>
      <button data-mode="register" class="${mode==='register'?'active':''}">Inscription</button>
    </div>` : '';

  $('#root').innerHTML = `
    <section class="auth-screen">
      <div class="auth-bg-blob b1"></div>
      <div class="auth-bg-blob b2"></div>
      <div class="auth-card">
        <div class="flagline"><i></i><i></i><i></i></div>
        <div class="auth-brand"><h1>MON <em>JOB</em></h1><p>Mise en relation professionnelle</p></div>
        ${sw}${body}
      </div>
    </section>`;

  $$('.auth-switch button').forEach(b => b.onclick = () => location.hash = '#/'+b.dataset.mode);

  if(mode==='login'){
    $('#formLogin').onsubmit = e => {
      e.preventDefault();
      if(handleLogin($('#li_email').value, $('#li_pass').value, $('#li_remember').checked)){

      if(handleReset(token, $('#rs_pass').value)) location.hash = '#/login';
    };
  }
  setTimeout(attachRipple, 30);
}

function conversations(u){
  const map = {};
  DB.messages.forEach(m => {
    if(m.fromId!==u.id && m.toId!==u.id) return;
    const other = m.fromId===u.id ? m.toId : m.fromId;
    const key = m.annonceId+'::'+other;
    if(!map[key]) map[key] = { annonceId:m.annonceId, otherId:other, last:m };
    else if(new Date(m.createdAt) > new Date(map[key].last.createdAt)) map[key].last = m;
  });
  return Object.values(map).sort((a,b)=>new Date(b.last.createdAt)-new Date(a.last.createdAt));
}
function renderMessages(u, annonceId, otherId){
  if(annonceId && otherId) return renderThread(u, annonceId, otherId);

function renderThread(u, annonceId, otherId){
  const a = DB.annonces.find(x => x.id===annonceId);
  const other = userById(otherId);
  if(!other) return emptyState('messages','Utilisateur introuvable','');
  const msgs = DB.messages.filter(m => m.annonceId===annonceId &&
    ((m.fromId===u.id && m.toId===otherId) || (m.fromId===otherId && m.toId===u.id)))
    .sort((x,y)=>new Date(x.createdAt)-new Date(y.createdAt));
  let marked = false;
  msgs.forEach(m => { if(m.fromId===otherId && m.toId===u.id && !m.lu){ m.lu = true; marked = true; } });
  if(marked) saveDB();
  return `
    <button class="btn btn-ghost btn-sm" data-nav="messages" style="margin-bottom:16px">${icon('arrowLeft',16)} Retour</button>
    <div class="card">
      <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px">
        ${other.photo ? `<img src="${other.photo}" class="avatar-md">` : `<div class="avatar-md">${esc(initials(other))}</div>`}
        <div style="flex:1"><div style="font-weight:700;font-size:16px">${esc(fullName(other))}</div>
          <div class="muted">${esc(other.role)}${other.metier?' — '+esc(other.metier):''}</div>
          <div style="margin-top:4px">${badgesHtml(other)}</div></div>
        ${other.role==='prestataire' ? `<div>${ratingHtml(other.id)}</div>` : ''}
      </div>
      <p class="muted" style="padding:10px;background:var(--line-2);border-radius:6px;margin-bottom:16px">Annonce : <strong>${esc(a?a.titre:'supprimée')}</strong></p>
      <div class="thread" id="thread">
        ${msgs.length ? msgs.map(m => `<div class="bubble ${m.fromId===u.id?'me':'them'}">${esc(m.texte)}<span class="time">${fmtDate(m.createdAt)}${m.fromId===u.id?(m.lu?' · Lu':' · Envoyé'):''}</span></div>`).join('') : '<div class="empty"><p>Aucun message.</p></div>'}
      </div>

}

function bindProfil(u){
  const f = $('#formProfil');
  if(!f) return;
  f.onsubmit = e => {
    e.preventDefault();
    const prenom = $('#p_prenom').value.trim();
    const nom = $('#p_nom').value.trim();
    const email = $('#p_email').value.trim().toLowerCase();
    const phone = $('#p_phone').value.trim();
    if(!prenom||!nom||!email||!phone){ toast('Champs obligatoires.','error'); return; }
    if(!emailValide(email)){ toast('Email invalide.','error'); return; }
    if(DB.users.some(x => x.id!==u.id && x.email.toLowerCase()===email)){ toast('Email déjà utilisé.','error'); return; }
    u.prenom = prenom; u.nom = nom; u.email = email; u.phone = phone;
    u.ville = $('#p_ville').value;
    const pm = $('#p_metier'); if(pm) u.metier = pm.value;
    const bio = $('#p_bio'); if(bio) u.bio = bio.value.trim();
    const p1 = $('#p_pass').value, p2 = $('#p_pass2').value;
    if(p1||p2){
      const errs = passwordErrors(p1);
      if(errs.length){ toast('Mot de passe faible : '+errs.join(', ')+'.','error'); return; }
      if(p1 !== p2){ toast('Mots de passe différents.','error'); return; }
      u.password = hashPassword(p1); audit('changement_mdp', u.email);
    }
    saveDB(); audit('maj_profil', u.email); toast('Profil mis à jour.','success'); render();
  };
  const pwd = $('#p_pass');

  const photoInput = $('#p_photo');

function readFile(input, cb){
  const f = input.files[0];
  if(!f) return;
  if(f.size > CONFIG.maxFileSize){ toast('Fichier trop volumineux.','error'); input.value=''; return; }

}

function chartBar(canvas, data, color='#F77F00'){
  const ctx = canvas.getContext('2d'); const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr; ctx.scale(dpr,dpr);
  const pad = {l:36,r:16,t:20,b:48}; const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  if(!data.length){ ctx.fillStyle='#94A3B8'; ctx.fillText('Aucune donnée', w/2-40, h/2); return; }
  const max = Math.max(...data.map(d=>d.value), 1);
  const barW = Math.min(60, cw/data.length*0.7); const step = cw/data.length;
  ctx.strokeStyle = '#E2E8F0';
  for(let i=0;i<=4;i++){ const y = pad.t+ch*(i/4); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke(); }
  data.forEach((d,i) => {
    const x = pad.l+step*i+(step-barW)/2; const bh = ch*(d.value/max); const y = pad.t+ch-bh;
    const grad = ctx.createLinearGradient(x, y, x, y+bh);
    grad.addColorStop(0, color); grad.addColorStop(1, color+'88');
    ctx.fillStyle = grad; ctx.fillRect(x,y,barW,bh);
    ctx.fillStyle = '#334155'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(d.label.slice(0,10), x+barW/2, h-pad.b+14);
    if(d.value>0) ctx.fillText(d.value, x+barW/2, y-4);
  });
}
function chartLine(canvas, data, color='#F77F00'){
  const ctx = canvas.getContext('2d'); const dpr = window.devicePixelRatio||1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*dpr; canvas.height = h*dpr; ctx.scale(dpr,dpr);
  const pad = {l:36,r:16,t:20,b:36}; const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
  const max = Math.max(...data.map(d=>d.value), 1);
  ctx.strokeStyle = '#E2E8F0';
  for(let i=0;i<=4;i++){ const y = pad.t+ch*(i/4); ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+cw,y); ctx.stroke(); }
  const step = cw/Math.max(1,data.length-1);
  ctx.beginPath();
  data.forEach((d,i) => { const x = pad.l+step*i, y = pad.t+ch-ch*(d.value/max); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.lineTo(pad.l+cw, pad.t+ch); ctx.lineTo(pad.l, pad.t+ch); ctx.closePath();
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t+ch);
  grad.addColorStop(0, 'rgba(247,127,0,0.25)'); grad.addColorStop(1, 'rgba(247,127,0,0)');
  ctx.fillStyle = grad; ctx.fill();
  ctx.beginPath();
  data.forEach((d,i) => { const x = pad.l+step*i, y = pad.t+ch-ch*(d.value/max); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
  ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.stroke();
  data.forEach((d,i) => {
    const x = pad.l+step*i, y = pad.t+ch-ch*(d.value/max);
    ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fillStyle = color; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x,y,1.5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#64748B'; ctx.font = '11px system-ui'; ctx.textAlign = 'center';
    ctx.fillText(d.label, x, h-pad.b+18);
  });
}

  let list = DB.annonces.slice();
  if(f.q){ const q = f.q.toLowerCase(); list = list.filter(a => (a.titre+' '+a.description+' '+a.categorie).toLowerCase().includes(q)); }
  if(f.statut) list = list.filter(a => a.statut===f.statut);
  list.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const perPage = 12, pages = Math.max(1, Math.ceil(list.length/perPage));
  const page = Math.min(f.page, pages);
  const slice = list.slice((page-1)*perPage, page*perPage);
  return `
    <div class="flex-between mb-4"><div><h2 class="page-title">Annonces</h2><p class="page-sub" style="margin:0">${list.length}</p></div>
      <button class="btn btn-ghost" id="btnExportAnnonces">${icon('download',16)} CSV</button></div>
    <div class="filter-bar">
      <div class="field"><label>Recherche</label><input type="search" id="aa_q" value="${esc(f.q)}"></div>
      <div class="field"><label>Statut</label><select id="aa_statut"><option value="">Tous</option>
        <option value="active" ${f.statut==='active'?'selected':''}>En ligne</option>
        <option value="attribuee" ${f.statut==='attribuee'?'selected':''}>Attribuées</option>
        <option value="terminee" ${f.statut==='terminee'?'selected':''}>Terminées</option>
        <option value="masquee" ${f.statut==='masquee'?'selected':''}>Masquées</option></select></div>
    </div>
    ${slice.length ? slice.map(a => {
      const client = userById(a.clientId);
      return `<div class="item">
        <div class="item-head">
          <div><div class="item-title">${esc(a.titre)}</div>
            <div class="item-meta">${esc(a.categorie)} · ${esc(a.ville)} · ${esc(client?fullName(client):'—')} · ${fmtDate(a.createdAt)}</div></div>
          ${annonceStatutBadge(a.statut)}
        </div>
        <div class="item-body">${esc(a.description).slice(0,200)}${a.description.length>200?'...':''}</div>
        <div class="item-actions">
          <button class="btn btn-ghost btn-sm" data-open-annonce="${a.id}">${icon('eye',16)} Voir</button>
          ${a.statut==='active'?`<button class="btn btn-ghost btn-sm" data-mask="${a.id}">Masquer</button>`:a.statut==='masquee'?`<button class="btn btn-green btn-sm" data-unmask="${a.id}">Restaurer</button>`:''}
          <button class="btn btn-danger btn-sm" data-del="${a.id}">${icon('trash',16)}</button>
        </div>
      </div>`;
    }).join('') : emptyState('annonces','Aucune annonce','Aucune annonce ne correspond aux filtres.')}
    ${pages>1?pagination(page, pages, 'adminAnnonces'):''}`;
}

function paginateList(list, page, renderItem){
  const total = list.length, pages = Math.max(1, Math.ceil(total/CONFIG.perPage));
  const p = Math.min(page, pages);
  const slice = list.slice((p-1)*CONFIG.perPage, p*CONFIG.perPage);
  const items = slice.map(renderItem);
  const html = pages>1 ? pagination(p, pages, 'annoncesFiltre') : '';
  return { items, html };
}
function pagination(page, pages, ctx){
  return `<div class="pagination" data-paginate="${ctx}">
    <button data-page="${page-1}" ${page<=1?'disabled':''}>${icon('chevronLeft',16)}</button>
    ${Array.from({length:pages},(_,i)=>i+1).map(n => `<button data-page="${n}" class="${n===page?'active':''}">${n}</button>`).join('')}
    <button data-page="${page+1}" ${page>=pages?'disabled':''}>${icon('chevronRight',16)}</button>
  </div>`;
}

    e.stopPropagation();

  if(fMsg) fMsg.onsubmit = e => {
    e.preventDefault(); const t = $('#msg_text').value.trim(); if(!t) return;

    notify(route[2], 'Nouveau message de '+fullName(u)+'.', '#/messages/'+route[1]+'/'+u.id);
    saveDB(); render(); const th = $('#thread'); if(th) th.scrollTop = th.scrollHeight;
  };
  const th = $('#thread'); if(th) th.scrollTop = th.scrollHeight;

  $$('[data-accept-devis]').forEach(b => b.onclick = async () => {
    const d = DB.devis.find(x => x.id===b.dataset.acceptDevis);
    if(!d) return;
    const ok = await confirmDialog({ title:'Accepter ce devis ?',
      message:'L\'annonce sera attribuée au prestataire. Un contrat sera généré automatiquement. Aucun paiement n\'est géré par la plateforme.',
      confirmLabel:'Accepter' });
    if(!ok) return;
    const a = DB.annonces.find(x => x.id===d.annonceId); if(!a) return;
    a.statut = 'attribuee'; a.attributedDevisId = d.id; d.statut = 'accepte';

    });

  $$('[data-refuse-devis]').forEach(b => b.onclick = async () => {

    const ok = await confirmDialog({ title:'Supprimer ?', message:'Action irréversible.', confirmLabel:'Supprimer', danger:true });
    if(!ok) return;
    DB.annonces = DB.annonces.filter(x => x.id!==a.id);
    DB.devis = DB.devis.filter(d => d.annonceId!==a.id);

  const uq = $('#u_q'); if(uq) uq.oninput = debounce(() => { state.usersFiltre.q = uq.value; state.usersFiltre.page=1; render(); }, 300);

  const aas = $('#aa_statut'); if(aas) aas.onchange = () => { state.adminAnnoncesFiltre.statut = aas.value; state.adminAnnoncesFiltre.page=1; render(); };

    const l = DB.litiges.find(x => x.id===b.dataset.resolveLitige);

  $$('[data-fermer-ticket]').forEach(b => b.onclick = () => {
    const t = DB.tickets.find(x => x.id===b.dataset.fermerTicket);
    if(t){ t.statut = 'ferme'; saveDB(); toast('Ticket fermé.','info'); render(); }

  if(route[0]==='admin' && route[1]==='dashboard') setTimeout(mountAdminCharts, 100);

function validateUser(userId){
  const x = userById(userId); if(!x) return;
  x.statut = 'actif'; x.kyc = x.kyc || {}; x.kyc.email = true;
  notify(x.id, 'Votre compte a été validé !', '#/dashboard');
  sendEmail(x.email, 'Compte validé', 'Bienvenue sur Mon Job.','validation');
  saveDB(); audit('compte_valide', x.email); toast('Compte validé.','success'); render();
}
function handlePublier(e){
  e.preventDefault();
  const u = me();
  const titre = $('#an_titre').value.trim();
  const cat = $('#an_cat').value;
  const ville = $('#an_ville').value;
  const desc = $('#an_desc').value.trim();
  const budget = $('#an_budget').value;
  const delai = $('#an_delai').value.trim();
  if(!titre || !desc){ toast('Champs requis.','error'); return; }
  const a = { id:uid('a'), clientId:u.id, titre, categorie:cat, ville, description:desc, budget, delai, statut:'active', createdAt:now() };
  DB.annonces.push(a);
  DB.users.filter(x => x.role==='prestataire' && x.statut==='actif' && x.metier===cat)
    .forEach(p => notify(p.id, 'Nouvelle annonce : "'+titre+'" à '+ville, '#/annonce/'+a.id));
  saveDB(); audit('annonce_publiee', titre);
  toast('Annonce publiée.','success'); navigate('mes-annonces');
}
function handleEnvoyerDevis(e){
  e.preventDefault();
  const u = me();
  const annonceId = getRoute()[1];
  const montant = $('#dv_montant').value;
  const delai = $('#dv_delai').value.trim();
  const message = $('#dv_message').value.trim();
  if(!montant || !delai || !message){ toast('Champs requis.','error'); return; }
  if(DB.devis.find(d => d.annonceId===annonceId && d.prestataireId===u.id)){ toast('Devis déjà envoyé.','warn'); return; }
  const a = DB.annonces.find(x => x.id===annonceId);
  if(!a){ toast('Annonce introuvable.','error'); return; }
  DB.devis.push({ id:uid('d'), annonceId, prestataireId:u.id, montant:Number(montant), delai, message, statut:'en_attente', createdAt:now() });
  notify(a.clientId, fullName(u)+' a envoyé un devis pour "'+a.titre+'".', '#/annonce/'+a.id);
  saveDB(); audit('devis_envoye', a.titre);
  toast('Devis envoyé.','success'); render();
}
function showAvisForm(annonceId, prestaId){
  const a = DB.annonces.find(x => x.id===annonceId);
  const p = userById(prestaId);
  if(!a || !p) return;
  let note = 5;
  openModal({ title:'Noter '+fullName(p),
    content:`<p class="muted mb-3">Pour la mission : ${esc(a.titre)}</p>
      <div class="field"><label>Note</label>
        <div class="star-input" id="starInput">
          ${[1,2,3,4,5].map(n => `<button type="button" data-n="${n}" class="${n<=note?'on':''}">${icon('starFill',28)}</button>`).join('')}
        </div></div>
      <div class="field"><label>Commentaire</label><textarea id="avis_comment" maxlength="500"></textarea></div>`,
    footer:`<button class="btn btn-ghost" data-cancel>Annuler</button><button class="btn btn-primary" data-submit>Publier</button>`,
    onMount: m => {
      $$('#starInput button').forEach(b => b.onclick = () => {
        note = Number(b.dataset.n);
        $$('#starInput button').forEach(x => x.classList.toggle('on', Number(x.dataset.n)<=note));
      });
      m.querySelector('[data-cancel]').onclick = closeModal;
      m.querySelector('[data-submit]').onclick = () => {
        DB.avis.push({ id:uid('v'), annonceId, fromId:me().id, toId:prestaId, note, commentaire:$('#avis_comment').value.trim(), createdAt:now() });
        notify(prestaId, fullName(me())+' vous a laissé un avis de '+note+'/5.', '#/mes-avis');
        saveDB(); audit('avis_publie', fullName(p)+' — '+note+'/5');
        toast('Avis publié.','success'); closeModal(); render();
      };
      attachRipple();
    }
  });
}
function showSignalerForm(annonceId){
  openModal({ title:'Signaler cette annonce',
    content:`<div class="field"><label>Motif</label>
      <select id="sig_raison"><option>Contenu inapproprié</option><option>Arnaque</option><option>Spam</option><option>Doublon</option><option>Autre</option></select></div>
      <div class="field"><label>Détails</label><textarea id="sig_detail" maxlength="300"></textarea></div>`,
    footer:`<button class="btn btn-ghost" data-cancel>Annuler</button><button class="btn btn-danger" data-submit>Signaler</button>`,
    onMount: m => {
      m.querySelector('[data-cancel]').onclick = closeModal;
      m.querySelector('[data-submit]').onclick = () => {
        DB.signalements.push({ id:uid('s'), annonceId, fromId:me().id, raison:$('#sig_raison').value, detail:$('#sig_detail').value.trim(), createdAt:now(), traite:false });
        DB.users.filter(x => x.role==='admin').forEach(a => notify(a.id, 'Signalement : '+$('#sig_raison').value, '#/admin/annonces'));
        saveDB(); audit('signalement', $('#sig_raison').value);
        toast('Signalement enregistré.','success'); closeModal();
      };
      attachRipple();
    }
  });
}
function showLitigeForm(annonceId){
  const a = DB.annonces.find(x => x.id===annonceId);
  if(!a) return;
  const other = a.clientId===me().id ? (a.attributedDevisId ? DB.devis.find(d=>d.id===a.attributedDevisId)?.prestataireId : null) : a.clientId;
  openModal({ title:'Ouvrir un litige',
    content:`<p class="muted mb-3">Annonce : ${esc(a.titre)}</p>
      <div class="field"><label>Motif</label>
        <select id="lit_motif"><option>Travail non conforme</option><option>Retard important</option><option>Non-paiement</option><option>Communication rompue</option><option>Autre</option></select></div>
      <div class="field"><label>Description</label><textarea id="lit_desc" maxlength="1000"></textarea></div>`,
    footer:`<button class="btn btn-ghost" data-cancel>Annuler</button><button class="btn btn-danger" data-submit>Ouvrir le litige</button>`,
    onMount: m => {
      m.querySelector('[data-cancel]').onclick = closeModal;
      m.querySelector('[data-submit]').onclick = () => {
        const numero = 'LT-'+(1000+DB.litiges.length+1);
        DB.litiges.push({ id:uid('l'), numero, annonceId, ouvertPar:me().id, contreId:other, motif:$('#lit_motif').value, description:$('#lit_desc').value.trim(), statut:'ouvert', createdAt:now() });
        DB.users.filter(x => x.role==='admin').forEach(a => notify(a.id, 'Nouveau litige '+numero, '#/admin/litiges'));
        saveDB(); audit('litige_ouvert', numero);
        toast('Litige ouvert. Dossier '+numero+'.','success'); closeModal(); navigate('litiges');
      };
      attachRipple();
    }
  });
}
function exportCSV(type){
  let rows = [], filename = '';
  if(type==='users'){
    filename = 'monjob-utilisateurs.csv';
    rows.push(['Prénom','Nom','Email','Téléphone','Ville','Rôle','Métier','Statut','Inscrit le']);
    DB.users.filter(u => u.role!=='admin').forEach(u => rows.push([u.prenom,u.nom,u.email,u.phone,u.ville,u.role,u.metier||'',u.statut,fmtDateShort(u.createdAt)]));
  } else {
    filename = 'monjob-annonces.csv';
    rows.push(['Titre','Catégorie','Ville','Client','Statut','Budget','Publiée le']);
    DB.annonces.forEach(a => { const c = userById(a.clientId); rows.push([a.titre,a.categorie,a.ville,c?fullName(c):'',a.statut,a.budget||'',fmtDateShort(a.createdAt)]); });
  }
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url); toast('CSV exporté.','success'); audit('export_csv', type);
}
