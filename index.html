<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon Job</title>
<style>
:root{
  --orange:#F77F00;--orange-h:#E06E00;--orange-s:#FFF3E0;
  --green:#009E60;--green-h:#008752;--green-s:#E6F6EE;
  --ink:#0F172A;--ink-2:#334155;--ink-3:#64748B;--ink-4:#94A3B8;
  --line:#E2E8F0;--line-2:#F1F5F9;--bg:#F8FAFC;--surface:#FFF;
  --red:#DC2626;--red-s:#FEF2F2;--amber:#D97706;--amber-s:#FFFBEB;
  --r:10px;--r-lg:14px;
  --sh-sm:0 1px 2px rgba(15,23,42,.06);
  --sh:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;font-size:15px;min-height:100vh}
.hidden{display:none!important}
a{color:var(--green);text-decoration:none;cursor:pointer}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit}
.muted{color:var(--ink-3);font-size:13px}
.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

.topbar{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.topbar-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{font-size:20px;font-weight:800;display:flex;align-items:center;gap:6px;cursor:pointer}
.logo b{color:var(--ink)}.logo em{font-style:normal;color:var(--orange)}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--orange),var(--green));
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:13px}
.avatar-lg{width:90px;height:90px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--orange),var(--green));
  display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:28px}

.tabs{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:62px;z-index:30;overflow-x:auto}
.tabs-inner{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;gap:2px}
.tab{padding:14px 16px;font-size:14px;font-weight:600;color:var(--ink-3);
  border-bottom:3px solid transparent;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--orange);border-bottom-color:var(--orange)}

.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 60px}
.page-title{font-size:22px;font-weight:800;margin-bottom:6px}
.page-sub{color:var(--ink-3);font-size:14px;margin-bottom:20px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--sh-sm)}
.card h3{font-size:16px;margin-bottom:14px;font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:8px;
  border:1px solid transparent;font-size:14px;font-weight:600;white-space:nowrap}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--orange);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--orange-h)}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover:not(:disabled){background:var(--green-h)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover:not(:disabled){border-color:var(--ink-4);background:var(--line-2)}
.btn-danger{background:var(--surface);border-color:#FCA5A5;color:var(--red)}
.btn-danger:hover:not(:disabled){background:var(--red-s)}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-lg{padding:12px 24px;font-size:15px}
.btn-block{width:100%}

label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink-2)}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],
input[type=file],select,textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:14px;
  background:var(--surface);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(247,127,0,.12)}
textarea{resize:vertical;min-height:90px}
.field{margin-bottom:14px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.field-row{grid-template-columns:1fr}}
.hint{font-size:12px;color:var(--ink-3);margin-top:5px}

.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh-sm)}
.stat .num{font-size:26px;font-weight:800;color:var(--orange)}
.stat .lbl{font-size:13px;color:var(--ink-3);margin-top:2px}

.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-orange{background:var(--orange-s);color:#B45309}
.badge-green{background:var(--green-s);color:var(--green-h)}
.badge-amber{background:var(--amber-s);color:var(--amber)}
.badge-grey{background:var(--line-2);color:var(--ink-2)}
.badge-red{background:var(--red-s);color:var(--red)}

.item{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;background:var(--surface)}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.item-title{font-weight:700;font-size:15px;margin-bottom:4px}
.item-meta{font-size:13px;color:var(--ink-3)}
.item-body{margin-top:10px;font-size:14px;color:var(--ink-2);line-height:1.6}
.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2)}

.banner{padding:14px 18px;border-radius:8px;font-size:14px;margin-bottom:16px}
.banner-warn{background:var(--amber-s);border:1px solid #FDBA74;color:#9A3412}

.empty{text-align:center;padding:40px 20px;color:var(--ink-3)}
.empty h4{font-size:15px;color:var(--ink-2);margin-bottom:6px;font-weight:700}
.empty p{font-size:14px;margin-bottom:16px}

.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 20px;
  background:linear-gradient(135deg,#FFF8F0 0%,#FFF 45%,#F0FAF5 100%)}
.auth-card{width:100%;max-width:460px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:30px;box-shadow:var(--sh)}
.auth-brand{text-align:center;margin-bottom:24px}
.auth-brand h1{font-size:26px;font-weight:800;letter-spacing:.5px}
.auth-brand h1 em{font-style:normal;color:var(--orange)}
.auth-brand p{color:var(--ink-3);font-size:13px;margin-top:4px}
.auth-switch{display:flex;background:var(--line-2);border-radius:8px;padding:4px;margin-bottom:20px}
.auth-switch button{flex:1;padding:9px;border-radius:6px;font-size:14px;font-weight:600;color:var(--ink-3)}
.auth-switch button.active{background:#fff;color:var(--orange);box-shadow:var(--sh-sm)}

.thread{display:flex;flex-direction:column;gap:10px;max-height:400px;overflow-y:auto;padding:14px;
  background:var(--line-2);border-radius:8px;margin-bottom:14px}
.bubble{max-width:78%;padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.5}
.bubble.me{align-self:flex-end;background:var(--green);color:#fff;border-bottom-right-radius:3px}
.bubble.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}
.bubble .time{display:block;font-size:11px;opacity:.7;margin-top:4px}

.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;padding:14px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.filter-bar .field{margin:0;flex:1;min-width:150px}

#toast-root{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;
  gap:10px;z-index:200;max-width:calc(100% - 32px);width:420px}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;box-shadow:var(--sh)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}
.toast.warn{background:var(--amber)}

table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;padding:10px;border-bottom:2px solid var(--line);font-size:11px;
  text-transform:uppercase;color:var(--ink-3);font-weight:700}
td{padding:10px;border-bottom:1px solid var(--line-2)}
.table-scroll{overflow-x:auto}

footer.foot{text-align:center;padding:20px;font-size:12px;color:var(--ink-3);
  border-top:1px solid var(--line);background:var(--surface);margin-top:40px}

@media(max-width:600px){
  .topbar-inner{padding:10px 14px}
  .wrap{padding:16px 14px 48px}
  .page-title{font-size:19px}
  .auth-card{padding:24px 20px}
  .tab{padding:12px 12px;font-size:13px}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast-root"></div>

<script>
/* =========================================================================
   CONFIGURATION
   ========================================================================= */
// ✅ URL MIS À JOUR POUR N8N EN LOCAL
const API_URL = 'http://localhost:5678/webhook/monjob'; 
const ODOO_WEB_URL = 'http://localhost:8069';   // ✅ URL de base Odoo pour les liens "Ouvrir dans Odoo"

const CATEGORIES = ['Plomberie','Electricite','Menuiserie','Maconnerie','Peinture',
  'Mecanique','Couture','Coiffure','Cuisine','Jardinage','Informatique',
  'Transport','Menage','Securite','Design','Marketing','Comptabilite',
  'Traduction','Autre'];

const VILLES = ['Abidjan','Bouake','Daloa','Yamoussoukro','San-Pedro','Korhogo',
  'Man','Gagnoa','Divo','Autre'];

const CAT_LABELS = {plomberie:'Plomberie',electricite:'Électricité',menuiserie:'Menuiserie',
  maconnerie:'Maçonnerie',peinture:'Peinture',mecanique:'Mécanique',couture:'Couture',
  coiffure:'Coiffure',cuisine:'Cuisine',jardinage:'Jardinage',informatique:'Informatique',
  transport:'Transport',menage:'Ménage',securite:'Sécurité',design:'Design',
  marketing:'Marketing',comptabilite:'Comptabilité',traduction:'Traduction',autre:'Autre'};

/* =========================================================================
   SESSION (token uniquement en sessionStorage)
   ========================================================================= */
const SESSION = {
  get token(){ return sessionStorage.getItem('monjob_token'); },
  set token(v){ if(v) sessionStorage.setItem('monjob_token', v); else sessionStorage.removeItem('monjob_token'); }
};

let USER = null;
let ROUTE = ['dashboard'];

/* =========================================================================
   API CLIENT
   ========================================================================= */
async function api(action, data = {}){
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ action, token: SESSION.token, ...data })
    });
    const text = await res.text();
    let json;
    try { json = JSON.parse(text); }
    catch {
      return { status:'error', message:'Réponse non-JSON ('+res.status+'): '+text.slice(0,160) };
    }
    if(!res.ok && json.status !== 'error'){
      json = { status:'error', message: json.message || ('HTTP '+res.status) };
    }
    return json;
  } catch(e){
    console.error('API error:', e);
    return { status:'error', message:'Erreur réseau (CORS ou n8n éteint) : '+e.message };
  }
}

/* =========================================================================
   UTILITAIRES
   ========================================================================= */
const $ = (s,el=document) => el.querySelector(s);
const $$ = (s,el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = iso => { if(!iso) return ''; const d = new Date(iso);
  return d.toLocaleDateString('fr-FR')+' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); };
const fmtDateShort = iso => { if(!iso) return ''; return new Date(iso).toLocaleDateString('fr-FR'); };
const fmtNum = n => n==null || n==='' ? '' : Number(n).toLocaleString('fr-FR');
const initials = u => u ? ((u.name||u.email||'?')[0]||'').toUpperCase() : '?';
const fullName = u => u ? (u.name || u.email || 'Utilisateur') : 'Utilisateur';
const catLabel = c => CAT_LABELS[c] || c || '';
const m2oId = v => Array.isArray(v) ? v[0] : (typeof v === 'number' ? v : null);

function toast(msg, type='info'){
  const t = document.createElement('div');
  t.className = 'toast '+type;
  t.textContent = msg;
  $('#toast-root').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; setTimeout(()=>t.remove(),300); }, 3500);
}

function passwordErrors(p){
  const e = [];
  if(p.length < 8) e.push('8 caractères minimum');
  if(!/[A-Z]/.test(p)) e.push('une majuscule');
  if(!/[a-z]/.test(p)) e.push('une minuscule');
  if(!/[0-9]/.test(p)) e.push('un chiffre');
  if(!/[^A-Za-z0-9]/.test(p)) e.push('un caractère spécial');
  return e;
}

/* =========================================================================
   ROUTER
   ========================================================================= */
function navigate(path){
  ROUTE = path.split('/');
  location.hash = '#/'+path;
}
window.addEventListener('hashchange', () => {
  ROUTE = location.hash.replace(/^#\/?/, '').split('/');
  if(ROUTE[0]==='') ROUTE = ['dashboard'];
  render();
});

/* =========================================================================
   RENDER
   ========================================================================= */
function render(){
  if(!USER) { renderAuth(); return; }
  renderShell();
}

/* ============ AUTH ============ */
let AUTH_MODE = 'login';

function renderAuth(){
  $('#root').innerHTML = `
    <div class="auth">
      <div class="auth-card">
        <div class="auth-brand"><h1>MON <em>JOB</em></h1><p>Mise en relation professionnelle</p></div>
        <div class="auth-switch">
          <button data-mode="login" class="${AUTH_MODE==='login'?'active':''}">Connexion</button>
          <button data-mode="register" class="${AUTH_MODE==='register'?'active':''}">Inscription</button>
        </div>
        ${AUTH_MODE === 'login' ? loginForm() : registerForm()}
      </div>
    </div>`;
  $$('.auth-switch button').forEach(b => b.onclick = () => {
    AUTH_MODE = b.dataset.mode; renderAuth();
  });
  if(AUTH_MODE === 'login') $('#formLogin').onsubmit = handleLogin;
  else {
    $('#formRegister').onsubmit = handleRegister;
    const roleSel = $('#rg_role');
    const metierWrap = $('#metierWrap');
    const toggleMetier = () => {
      metierWrap.style.display = roleSel.value === 'prestataire' ? '' : 'none';
    };
    roleSel.onchange = toggleMetier;
    toggleMetier();
  }
}

function loginForm(){
  return `
    <form id="formLogin" novalidate>
      <div class="field"><label>Email</label><input type="email" id="li_email" required autocomplete="email"></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="li_pass" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg">Se connecter</button>
    </form>
    <p class="hint" style="text-align:center;margin-top:16px">
      Démonstration admin : admin@monjob.ci / Admin@2026
    </p>`;
}

function registerForm(){
  return `
    <form id="formRegister" novalidate>
      <div class="field"><label>Je m'inscris en tant que</label>
        <select id="rg_role">
          <option value="client">Client — je publie des annonces</option>
          <option value="prestataire">Prestataire — je propose mes services</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field"><label>Prénom</label><input type="text" id="rg_prenom" required></div>
        <div class="field"><label>Nom</label><input type="text" id="rg_nom" required></div>
      </div>
      <div class="field"><label>Email</label><input type="email" id="rg_email" required></div>
      <div class="field"><label>Téléphone</label><input type="tel" id="rg_phone" required></div>
      <div class="field-row">
        <div class="field"><label>Ville</label>
          <select id="rg_ville">${VILLES.map(v=>`<option>${v}</option>`).join('')}</select></div>
        <div class="field" id="metierWrap" style="display:none"><label>Métier</label>
          <select id="rg_metier">${CATEGORIES.map(c=>`<option value="${c}">${catLabel(c)}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Mot de passe</label><input type="password" id="rg_pass" required>
        <p class="hint">8 caractères, majuscule, minuscule, chiffre, caractère spécial.</p></div>
      <div class="field"><label>Confirmer</label><input type="password" id="rg_pass2" required></div>
      <button type="submit" class="btn btn-green btn-block btn-lg">Créer mon compte</button>
    </form>`;
}

async function handleLogin(ev){
  ev.preventDefault();
  const email = $('#li_email').value.trim();
  const password = $('#li_pass').value;
  if(!email || !password){ toast('Champs requis','error'); return; }
  const r = await api('auth.login', { email, password });
  if(r.status !== 'ok'){ toast(r.message || 'Erreur', 'error'); return; }
  SESSION.token = r.token;
  USER = r.user;
  toast('Bienvenue ' + fullName(USER), 'success');
  navigate('dashboard');
  render();
}

async function handleRegister(ev){
  ev.preventDefault();
  const role = $('#rg_role').value;
  const prenom = $('#rg_prenom').value.trim();
  const nom = $('#rg_nom').value.trim();
  const email = $('#rg_email').value.trim();
  const phone = $('#rg_phone').value.trim();
  const ville = $('#rg_ville').value;
  const metier = role === 'prestataire' ? $('#rg_metier').value : '';
  const password = $('#rg_pass').value;
  const password2 = $('#rg_pass2').value;

  if(!prenom || !nom || !email || !phone){ toast('Champs requis','error'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ toast('Email invalide','error'); return; }
  const errs = passwordErrors(password);
  if(errs.length){ toast('Mot de passe faible : ' + errs.join(', '), 'error'); return; }
  if(password !== password2){ toast('Mots de passe différents', 'error'); return; }

  const r = await api('user.register', { role, prenom, nom, email, phone, ville, metier, password });
  if(r.status !== 'ok'){ toast(r.message || 'Erreur', 'error'); return; }
  toast('Compte créé. En attente de validation administrateur.', 'success');
  AUTH_MODE = 'login';
  renderAuth();
}

function logout(){
  SESSION.token = null;
  USER = null;
  navigate('login');
  renderAuth();
}

/* ============ SHELL ============ */
function renderShell(){
  const tabs = tabsFor(USER);
  $('#root').innerHTML = `
    <header class="topbar">
      <div class="topbar-inner">
        <div class="logo" id="logoBtn"><b>MON</b>&nbsp;<em>JOB</em></div>
        <div class="topbar-actions">
          ${USER.photo ? `<img src="${USER.photo}" class="avatar" alt="">` : `<div class="avatar">${esc(initials(USER))}</div>`}
          <button class="btn btn-ghost btn-sm" id="btnLogout">Déconnexion</button>
        </div>
      </div>
    </header>
    <nav class="tabs"><div class="tabs-inner">
      ${tabs.map(([id,label]) => `
        <button class="tab ${ROUTE[0]===id?'active':''}" data-tab="${id}">${label}</button>`).join('')}
    </div></nav>
    <main class="wrap" id="main"></main>
    <footer class="foot">Mon Job — Plateforme professionnelle de mise en relation</footer>`;

  $('#logoBtn').onclick = () => navigate('dashboard');
  $('#btnLogout').onclick = logout;
  $$('.tab').forEach(t => t.onclick = () => navigate(t.dataset.tab));

  if(USER.monjob_role !== 'admin' && USER.statut !== 'actif'){
    $('#main').innerHTML = `
      <div class="banner banner-warn">
        Votre compte est en attente de validation par un administrateur.
      </div>
      ${renderProfil()}`;
    bindProfil();
    return;
  }

  renderPage();
}

function tabsFor(u){
  if(u.monjob_role === 'admin'){
    return [['dashboard','Tableau de bord'],['admin/inscriptions','Inscriptions'],
      ['admin/users','Utilisateurs'],['admin/annonces','Annonces'],['profil','Profil']];
  }
  if(u.monjob_role === 'prestataire'){
    return [['dashboard','Tableau de bord'],['annonces-disponibles','Annonces'],
      ['messages','Messages'],['profil','Profil']];
  }
  return [['dashboard','Tableau de bord'],['mes-annonces','Mes annonces'],
    ['publier','Publier'],['messages','Messages'],['profil','Profil']];
}

/* ============ PAGE ROUTER ============ */
async function renderPage(){
  const main = $('#main');
  const key = ROUTE[0] + (ROUTE[1] ? '/'+ROUTE[1] : '');

  const pages = {
    'dashboard': renderDashboard,
    'mes-annonces': () => renderAnnonces('mine'),
    'annonces-disponibles': () => renderAnnonces('available'),
    'publier': renderPublier,
    'annonce': () => renderAnnonceDetail(ROUTE[1]),
    'messages': () => renderMessages(ROUTE[1], ROUTE[2]),
    'profil': async () => { main.innerHTML = renderProfil(); bindProfil(); },
    'admin/inscriptions': renderAdminInscriptions,
    'admin/users': renderAdminUsers,
    'admin/annonces': () => renderAnnonces('all')
  };

  const fn = pages[key];
  if(!fn){ main.innerHTML = `<div class="card"><div class="empty"><h4>Page introuvable</h4></div></div>`; return; }
  await fn();
}

/* ============ DASHBOARD ============ */
async function renderDashboard(){
  const main = $('#main');
  main.innerHTML = `<div class="card">Chargement...</div>`;
  const r = await api('dashboard');
  if(r.status !== 'ok'){ main.innerHTML = `<div class="card"><div class="empty"><h4>Erreur</h4><p>${esc(r.message)}</p></div></div>`; return; }
  const annonces = r.annonces || [];

  if(USER.monjob_role === 'admin'){
    main.innerHTML = `
      <h2 class="page-title">Administration</h2>
      <p class="page-sub">Bonjour ${esc(fullName(USER))}.</p>
      <div class="grid grid-4">
        <div class="stat"><div class="num">${annonces.length}</div><div class="lbl">Annonces actives</div></div>
        <div class="stat"><div class="num">${USER.note_moyenne || 0}</div><div class="lbl">Note</div></div>
      </div>
      <div class="card" style="margin-top:20px">
        <h3>Accès rapide</h3>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-primary btn-sm" onclick="navigate('admin/inscriptions')">Voir les inscriptions</button>
          <button class="btn btn-ghost btn-sm" onclick="navigate('admin/users')">Tous les utilisateurs</button>
          <button class="btn btn-ghost btn-sm" onclick="navigate('admin/annonces')">Toutes les annonces</button>
        </div>
      </div>`;
    return;
  }

  main.innerHTML = `
    <h2 class="page-title">Bonjour ${esc(fullName(USER))}</h2>
    <p class="page-sub">${esc(USER.monjob_role === 'prestataire' ? 'Vos opportunités' : 'Vos annonces et devis')}</p>
    <div class="grid grid-4" style="margin-bottom:20px">
      <div class="stat"><div class="num">${annonces.length}</div>
        <div class="lbl">${USER.monjob_role === 'prestataire' ? 'Annonces disponibles' : 'Annonces publiées'}</div></div>
      <div class="stat"><div class="num">${USER.note_moyenne || 0}</div><div class="lbl">Note moyenne</div></div>
      <div class="stat"><div class="num">${USER.nombre_avis || 0}</div><div class="lbl">Avis reçus</div></div>
      <div class="stat"><div class="num">${esc(USER.statut === 'actif' ? 'Actif' : USER.statut || '')}</div><div class="lbl">Statut</div></div>
    </div>
    <div class="card">
      <div class="flex-between" style="margin-bottom:14px">
        <h3 style="margin:0">${USER.monjob_role === 'prestataire' ? 'Dernières annonces' : 'Vos dernières annonces'}</h3>
        ${USER.monjob_role === 'client' ? `<button class="btn btn-primary btn-sm" onclick="navigate('publier')">Publier</button>` : ''}
      </div>
      ${annonces.length ? annonces.slice(0,5).map(a => annonceItem(a)).join('') :
        `<div class="empty"><h4>Aucune annonce</h4>
         <p>${USER.monjob_role === 'client' ? 'Publiez votre première annonce.' : 'Revenez plus tard.'}</p></div>`}
    </div>`;
}

/* ============ ANNONCES ============ */
function annonceItem(a){
  const statut = a.state || 'active';
  const badge = statut === 'active' ? 'badge-green'
    : statut === 'attribuee' ? 'badge-orange'
    : statut === 'terminee' ? 'badge-grey' : 'badge-red';
  const label = statut === 'active' ? 'En ligne'
    : statut === 'attribuee' ? 'Attribuée'
    : statut === 'terminee' ? 'Terminée' : statut;
  return `<div class="item">
    <div class="item-head">
      <div>
        <div class="item-title">${esc(a.name)}</div>
        <div class="item-meta">${esc(catLabel(a.categorie))} · ${esc(a.ville)} · ${fmtDateShort(a.create_date)}</div>
      </div>
      <span class="badge ${badge}">${esc(label)}</span>
    </div>
    <div class="item-body">${esc((a.description||'').slice(0,200))}${(a.description||'').length>200?'...':''}</div>
    <div class="item-meta" style="margin-top:8px">
      ${a.budget ? `Budget : ${fmtNum(a.budget)} FCFA` : ''}
      ${a.delai ? ` · Délai : ${esc(a.delai)}` : ''}
    </div>
    <div class="item-actions">
      <button class="btn btn-ghost btn-sm" data-open="${a.id}">Voir le détail</button>
    </div>
  </div>`;
}

async function renderAnnonces(scope){
  const main = $('#main');
  main.innerHTML = `<div class="card">Chargement...</div>`;
  const r = await api('annonces.list', { scope });
  if(r.status !== 'ok'){ main.innerHTML = `<div class="card">Erreur : ${esc(r.message)}</div>`; return; }
  const list = r.annonces || [];

  const titles = { mine:'Mes annonces', available:'Annonces disponibles', all:'Toutes les annonces' };
  main.innerHTML = `
    <div class="flex-between" style="margin-bottom:16px">
      <div>
        <h2 class="page-title">${titles[scope] || 'Annonces'}</h2>
        <p class="page-sub" style="margin:0">${list.length} annonce(s)</p>
      </div>
      ${scope === 'mine' || USER.monjob_role === 'client' ? `<button class="btn btn-primary btn-sm" onclick="navigate('publier')">Publier</button>` : ''}
    </div>
    ${list.length ? list.map(a => annonceItem(a)).join('') :
      `<div class="card"><div class="empty"><h4>Aucune annonce</h4></div></div>`}`;
  bindAnnoncesClick();
}

function bindAnnoncesClick(){
  $$('[data-open]').forEach(b => b.onclick = () => navigate('annonce/'+b.dataset.open));
}

async function renderPublier(){
  const main = $('#main');
  main.innerHTML = `
    <h2 class="page-title">Publier une annonce</h2>
    <p class="page-sub">Décrivez votre besoin.</p>
    <div class="card" style="max-width:700px">
      <form id="formAnnonce">
        <div class="field"><label>Titre</label><input type="text" id="an_titre" required maxlength="120"></div>
        <div class="field-row">
          <div class="field"><label>Catégorie</label>
            <select id="an_cat">${CATEGORIES.map(c=>`<option value="${c}">${catLabel(c)}</option>`).join('')}</select></div>
          <div class="field"><label>Ville</label>
            <select id="an_ville">${VILLES.map(v=>`<option>${v}</option>`).join('')}</select></div>
        </div>
        <div class="field"><label>Description</label><textarea id="an_desc" required maxlength="2000"></textarea></div>
        <div class="field-row">
          <div class="field"><label>Budget (FCFA)</label><input type="number" id="an_budget" min="0"></div>
          <div class="field"><label>Délai</label><input type="text" id="an_delai"></div>
        </div>
        <div style="display:flex;gap:8px">
          <button type="submit" class="btn btn-primary btn-lg">Publier</button>
          <button type="button" class="btn btn-ghost" onclick="navigate('dashboard')">Annuler</button>
        </div>
      </form>
    </div>`;

  $('#formAnnonce').onsubmit = async (ev) => {
    ev.preventDefault();
    const r = await api('annonce.publish', {
      titre: $('#an_titre').value.trim(),
      categorie: $('#an_cat').value,
      ville: $('#an_ville').value,
      description: $('#an_desc').value.trim(),
      budget: $('#an_budget').value || 0,
      delai: $('#an_delai').value.trim()
    });
    if(r.status !== 'ok'){ toast(r.message || 'Erreur', 'error'); return; }
    toast('Annonce publiée', 'success');
    navigate('mes-annonces');
  };
}

async function renderAnnonceDetail(id){
  const main = $('#main');
  if(!id){ main.innerHTML = `<div class="card">Annonce introuvable</div>`; return; }
  main.innerHTML = `<div class="card">Chargement...</div>`;

  const r = await api('annonces.list', { scope: 'all' });
  if(r.status !== 'ok'){ main.innerHTML = `<div class="card">Erreur</div>`; return; }
  const a = (r.annonces || []).find(x => String(x.id) === String(id));
  if(!a){ main.innerHTML = `<div class="card"><div class="empty"><h4>Annonce introuvable</h4></div></div>`; return; }

  const clientId = m2oId(a.client_id);
  const myId = parseInt(SESSION.token, 10);
  const isOwner = USER.monjob_role === 'client' && clientId === myId;
  const isPresta = USER.monjob_role === 'prestataire' && a.state === 'active';

  main.innerHTML = `
    <button class="btn btn-ghost btn-sm" onclick="history.back()" style="margin-bottom:16px">← Retour</button>
    <div class="card">
      <div class="flex-between" style="margin-bottom:12px">
        <div>
          <h2 class="page-title" style="margin-bottom:6px">${esc(a.name)}</h2>
          <div class="item-meta">${esc(catLabel(a.categorie))} · ${esc(a.ville)} · ${fmtDate(a.create_date)}</div>
        </div>
        ${a.state === 'active' ? '<span class="badge badge-green">En ligne</span>' : `<span class="badge badge-grey">${esc(a.state)}</span>`}
      </div>
      <p style="white-space:pre-wrap;line-height:1.7;color:var(--ink-2)">${esc(a.description)}</p>
      <div style="margin-top:16px;padding-top:16px;border-top:1px solid var(--line-2);
        display:flex;gap:24px;flex-wrap:wrap">
        <div><div class="muted">Budget</div><strong>${a.budget ? fmtNum(a.budget)+' FCFA' : 'Non précisé'}</strong></div>
        <div><div class="muted">Délai</div><strong>${a.delai ? esc(a.delai) : 'Non précisé'}</strong></div>
      </div>
    </div>

    ${isPresta ? `
      <div class="card">
        <h3>Envoyer un devis</h3>
        <form id="formDevis">
          <div class="field-row">
            <div class="field"><label>Montant (FCFA)</label><input type="number" id="dv_montant" min="0" required></div>
            <div class="field"><label>Délai</label><input type="text" id="dv_delai" required placeholder="Ex. 3 jours"></div>
          </div>
          <div class="field"><label>Message</label><textarea id="dv_message" required></textarea></div>
          <button type="submit" class="btn btn-green">Envoyer le devis</button>
        </form>
      </div>` : ''}

    ${isOwner ? `
      <div class="card">
        <h3>Devis reçus</h3>
        <p class="muted" style="margin-bottom:12px">Consultez vos devis depuis Odoo pour accepter ou refuser.</p>
        <button class="btn btn-ghost btn-sm" onclick="window.open('${ODOO_WEB_URL}/odoo/monjob-annonces/${a.id}','_blank')">
          Ouvrir dans Odoo
        </button>
      </div>` : ''}

    ${!isOwner && clientId ? `
      <div class="card">
        <h3>Contacter</h3>
        <button class="btn btn-primary btn-sm" data-contact="${a.id}|${clientId}">
          Envoyer un message au client
        </button>
      </div>` : ''}`;

  const fDev = $('#formDevis');
  if(fDev) fDev.onsubmit = async (ev) => {
    ev.preventDefault();
    const r2 = await api('devis.create', {
      annonceId: a.id,
      montant: parseInt($('#dv_montant').value, 10) || 0,
      delai: $('#dv_delai').value.trim(),
      message: $('#dv_message').value.trim()
    });
    if(r2.status !== 'ok'){ toast(r2.message || 'Erreur', 'error'); return; }
    toast('Devis envoyé', 'success');
    navigate('annonce/'+a.id);
  };

  $$('[data-contact]').forEach(b => b.onclick = () => {
    const [aid, toId] = b.dataset.contact.split('|');
    if(!toId || toId === 'null'){ toast('Destinataire inconnu', 'error'); return; }
    navigate('messages/'+aid+'/'+toId);
  });
}

/* ============ MESSAGES ============ */
async function renderMessages(annonceId, otherId){
  const main = $('#main');
  if(annonceId && otherId){ return renderThread(annonceId, otherId); }

  main.innerHTML = `
    <h2 class="page-title">Messages</h2>
    <p class="page-sub">Vos conversations sont accessibles depuis le détail d'une annonce.</p>
    <div class="card">
      <div class="empty">
        <h4>Ouvrez une annonce pour démarrer</h4>
        <p>Cliquez sur "Contacter" depuis le détail d'une annonce.</p>
        <button class="btn btn-primary" onclick="navigate('annonces-disponibles')">Voir les annonces</button>
      </div>
    </div>`;
}

async function renderThread(annonceId, otherId){
  const main = $('#main');
  const aid = parseInt(annonceId, 10);
  const toId = parseInt(otherId, 10);
  if(!Number.isFinite(aid) || !Number.isFinite(toId)){
    main.innerHTML = `<div class="card"><div class="empty"><h4>Conversation invalide</h4></div></div>`;
    return;
  }
  main.innerHTML = `<div class="card">Chargement...</div>`;
  const r = await api('messages.list', { annonceId: aid });
  if(r.status !== 'ok'){ main.innerHTML = `<div class="card">Erreur : ${esc(r.message)}</div>`; return; }
  const msgs = r.messages || [];
  const myId = parseInt(SESSION.token, 10);

  main.innerHTML = `
    <button class="btn btn-ghost btn-sm" onclick="navigate('messages')" style="margin-bottom:16px">← Retour</button>
    <div class="card">
      <div class="thread" id="thread">
        ${msgs.length ? msgs.map(m => {
          const expId = m2oId(m.expediteur_id);
          const isMe = expId === myId;
          return `<div class="bubble ${isMe?'me':'them'}">
            ${esc(m.contenu)}
            <span class="time">${fmtDate(m.create_date)}</span>
          </div>`;
        }).join('') : '<div class="empty"><p>Aucun message. Écrivez le premier.</p></div>'}
      </div>
      <form id="formMsg">
        <div class="field"><textarea id="msg_text" required placeholder="Votre message..."></textarea></div>
        <button type="submit" class="btn btn-primary">Envoyer</button>
      </form>
    </div>`;

  const th = $('#thread');
  if(th) th.scrollTop = th.scrollHeight;

  $('#formMsg').onsubmit = async (ev) => {
    ev.preventDefault();
    const texte = $('#msg_text').value.trim();
    if(!texte) return;
    const r2 = await api('message.send', { annonceId: aid, toId, texte });
    if(r2.status !== 'ok'){ toast(r2.message || 'Erreur', 'error'); return; }
    renderThread(annonceId, otherId);
  };
}

/* ============ PROFIL ============ */
function renderProfil(){
  return `
    <h2 class="page-title">Mon profil</h2>
    <p class="page-sub">Vos informations personnelles.</p>
    <div class="card" style="max-width:700px">
      <div style="display:flex;gap:20px;align-items:center;margin-bottom:20px;flex-wrap:wrap">
        ${USER.photo ? `<img src="${USER.photo}" class="avatar-lg" alt="">`
          : `<div class="avatar-lg">${esc(initials(USER))}</div>`}
        <div>
          <div style="font-weight:700;font-size:17px">${esc(fullName(USER))}</div>
          <div class="muted">${esc(USER.monjob_role)}${USER.metier ? ' — '+esc(USER.metier) : ''}</div>
          <div style="margin-top:8px">
            ${USER.statut === 'actif' ? '<span class="badge badge-green">Actif</span>'
              : USER.statut === 'en_attente' ? '<span class="badge badge-amber">En attente</span>'
              : '<span class="badge badge-red">' + esc(USER.statut) + '</span>'}
          </div>
        </div>
      </div>
      <form id="formProfil">
        <div class="field-row">
          <div class="field"><label>Nom affiché</label><input type="text" id="p_name" value="${esc(USER.name||'')}" required></div>
          <div class="field"><label>Téléphone</label><input type="tel" id="p_phone" value="${esc(USER.phone||'')}" required></div>
        </div>
        <div class="field">
          <label>Email (non modifiable)</label>
          <input type="email" value="${esc(USER.email||'')}" disabled>
        </div>
        <div class="field"><label>Ville</label>
          <input type="text" id="p_ville" value="${esc(USER.city||'')}" required></div>
        <div class="field">
          <label>Photo de profil</label>
          <input type="file" id="p_photo" accept="image/*">
          <p class="hint">JPEG/PNG. L'upload vers Odoo sera implémenté dans une prochaine étape.</p>
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
      </form>
    </div>`;
}

function bindProfil(){
  const f = $('#formProfil');
  if(!f) return;
  f.onsubmit = async (ev) => {
    ev.preventDefault();
    const r = await api('profil.update', {
      name: $('#p_name').value.trim(),
      phone: $('#p_phone').value.trim(),
      ville: $('#p_ville').value.trim()
    });
    if(r.status !== 'ok'){ toast(r.message || 'Erreur', 'error'); return; }
    toast('Profil mis à jour', 'success');
    const me = await api('auth.me');
    if(me.status === 'ok') USER = me.user;
    render();
  };
}

/* ============ ADMIN ============ */
async function renderAdminInscriptions(){
  const main = $('#main');
  main.innerHTML = `<div class="card">Chargement...</div>`;
  const r = await api('admin.users');
  if(r.status !== 'ok'){ main.innerHTML = `<div class="card">Erreur : ${esc(r.message)}</div>`; return; }
  const list = (r.users || []).filter(u => u.statut === 'en_attente');

  main.innerHTML = `
    <h2 class="page-title">Inscriptions à valider</h2>
    <p class="page-sub">${list.length} compte(s) en attente</p>
    ${list.length ? list.map(u => `
      <div class="item">
        <div class="item-head">
          <div style="display:flex;gap:12px;align-items:center">
            <div class="avatar">${esc(initials(u))}</div>
            <div>
              <div class="item-title">${esc(fullName(u))}</div>
              <div class="item-meta">${esc(u.monjob_role)}${u.metier ? ' — '+esc(u.metier) : ''} · ${esc(u.city||'')}</div>
            </div>
          </div>
          <span class="badge badge-amber">En attente</span>
        </div>
        <div class="item-meta" style="margin-top:8px">Email : ${esc(u.email)} · Tél : ${esc(u.phone||'')}</div>
        <div class="item-actions">
          <button class="btn btn-green btn-sm" data-validate="${u.id}">Valider</button>
          <button class="btn btn-danger btn-sm" data-reject="${u.id}">Refuser</button>
        </div>
      </div>`).join('') : '<div class="card"><div class="empty"><h4>Aucune inscription en attente</h4></div></div>'}`;

  $$('[data-validate]').forEach(b => b.onclick = async () => {
    const r2 = await api('admin.validate', { userId: parseInt(b.dataset.validate) });
    if(r2.status === 'ok'){ toast('Compte validé', 'success'); renderAdminInscriptions(); }
    else toast(r2.message, 'error');
  });
  $$('[data-reject]').forEach(b => b.onclick = async () => {
    if(!confirm('Refuser cette inscription ?')) return;
    const r2 = await api('admin.reject', { userId: parseInt(b.dataset.reject) });
    if(r2.status === 'ok'){ toast('Inscription refusée', 'info'); renderAdminInscriptions(); }
    else toast(r2.message, 'error');
  });
}

async function renderAdminUsers(){
  const main = $('#main');
  main.innerHTML = `<div class="card">Chargement...</div>`;
  const r = await api('admin.users');
  if(r.status !== 'ok'){ main.innerHTML = `<div class="card">Erreur</div>`; return; }
  const list = (r.users || []).filter(u => u.id !== parseInt(SESSION.token));

  main.innerHTML = `
    <h2 class="page-title">Utilisateurs</h2>
    <p class="page-sub">${list.length} utilisateur(s)</p>
    <div class="card table-scroll">
      <table>
        <thead><tr><th>Nom</th><th>Rôle</th><th>Email</th><th>Ville</th><th>Statut</th></tr></thead>
        <tbody>
          ${list.map(u => `<tr>
            <td><strong>${esc(fullName(u))}</strong></td>
            <td>${esc(u.monjob_role)}${u.metier ? '<br><span class="muted">'+esc(u.metier)+'</span>' : ''}</td>
            <td>${esc(u.email)}</td>
            <td>${esc(u.city||'')}</td>
            <td>${u.statut === 'actif' ? '<span class="badge badge-green">Actif</span>'
              : u.statut === 'en_attente' ? '<span class="badge badge-amber">En attente</span>'
              : '<span class="badge badge-red">'+esc(u.statut)+'</span>'}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

/* ============ BOOT ============ */
(async () => {
  if(SESSION.token){
    const r = await api('auth.me');
    if(r.status === 'ok'){ USER = r.user; }
    else { SESSION.token = null; }
  }
  if(!location.hash || location.hash === '#/login') navigate('dashboard');
  else ROUTE = location.hash.replace(/^#\/?/, '').split('/');
  render();
})();
</script>
</body>
</html>
